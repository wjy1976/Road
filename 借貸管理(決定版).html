<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>借貸管理系統 (本地版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-slate-100 text-gray-800">

    <div id="app"></div>

    <!-- 錯誤訊息容器 -->
    <div id="error-container" class="hidden fixed inset-0 bg-red-50 flex items-center justify-center p-4 z-50">
        <div class="text-red-600 p-4 border border-red-300 rounded bg-white shadow-lg max-w-lg">
            <h3 class="font-bold text-lg mb-2">系統發生錯誤</h3>
            <p id="error-message" class="text-sm"></p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, signInAnonymously, signInWithCustomToken, updateProfile } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, deleteDoc, updateDoc, serverTimestamp, writeBatch, orderBy, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        // --- Configuration ---
        const apiKey = ""; // 若有 API Key 可填入
        
        // --- Initialization ---
        let app, auth, db;
        let firebaseAvailable = false;

        try {
            const firebaseConfigStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
            if (firebaseConfigStr) {
                const firebaseConfig = JSON.parse(firebaseConfigStr);
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                firebaseAvailable = true;
            } else {
                console.warn("未偵測到 Firebase 設定，將自動進入本地試用模式。");
            }
        } catch (e) {
            console.warn("Firebase 初始化失敗:", e);
            firebaseAvailable = false;
        }

        // --- Global State ---
        const state = {
            currentUser: firebaseAvailable ? null : 'Guest',
            isDemoMode: !firebaseAvailable,
            isRegistering: false, // New state for Auth toggle
            authLoading: false,
            activeTab: 'dashboard',
            records: [],
            editingRecord: null,
            searchTerm: '',
            repaymentSearchTerm: '',
            selectedRepaymentId: '',
            repaymentDate: new Date().toISOString().split('T')[0],
            repaymentPrincipal: '',
            repaymentInterest: '',
            currentPage: 1,
            itemsPerPage: 12,
            modalType: null,
            messageModalRecord: null,
            showAIModal: false,
            activeModal: { type: null, record: null },
            aiReport: '',
            aiMessage: '',
            aiLoading: false
        };

        // ... (Demo Data Logic Remains Same) ...
        if (state.isDemoMode) {
             state.records = [
                { id: 'demo1', caseNumber: '#001', borrower: '王小明', status: '1', method: '叨簿子', loanAmount: 100000, disbursed: 90000, interestRate: 0.05, terms: 10, principalPerTerm: 10000, interestPerTerm: 5000, date: '2023-10-01', repaidTerms: 2, actualReceivedMonth: 20000, actualInterestMonth: 10000, totalInterestIncome: 10000, outstandingPrincipal: 100000, arrears: 80000, note: '正常繳款中' },
                { id: 'demo2', caseNumber: '#002', borrower: '李大華', status: '2', method: '設定', loanAmount: 500000, disbursed: 450000, interestRate: 0.03, specialRate: 0.05, terms: 0, principalPerTerm: 0, interestPerTerm: 15000, date: '2023-09-15', repaidTerms: 0, actualReceivedMonth: 0, actualInterestMonth: 45000, totalInterestIncome: 45000, outstandingPrincipal: 0, arrears: 0, note: '代管案件，每月僅收息' },
                { id: 'demo3', caseNumber: '#003', borrower: '陳淑芬', status: '3', method: '票貼', loanAmount: 30000, disbursed: 27000, interestRate: 0.10, terms: 3, principalPerTerm: 10000, interestPerTerm: 3000, date: '2023-11-01', repaidTerms: 0, actualReceivedMonth: 0, actualInterestMonth: 0, totalInterestIncome: 0, outstandingPrincipal: 30000, arrears: 30000, note: '已失聯，列為呆帳' }
             ];
        }

        const initialFormState = {
            status: '1', method: '叨簿子', date: '', borrower: '', job: '',
            idNumber: '', address: '', telephone: '', mobile: '',
            loanAmount: '', disbursed: '', interestRate: '', specialRate: '', agent: '', 
            terms: '', repayDay: '', principalPerTerm: '', interestPerTerm: '',
            repaidTerms: '', interestIncome: '', arrears: '', outstandingPrincipal: '',
            remainingTerms: '', roiRemainingTerms: '', totalInterestIncome: '', actualReceivedMonth: '',
            actualInterestMonth: '', managementFee: '', note: '', schedule: ''
        };
        let formData = { ...initialFormState };

        // --- Helper Functions ---
        const formatNumber = (num) => {
            // Priority 1: Handle non-numeric strings (like #001) first
            if (typeof num === 'string' && !/^-?\d/.test(num)) return num;
            
            // Priority 2: Handle empty/null
            if (num === '∞' || num === '-') return num;
            if (num === null || num === undefined || num === '') return "";
            
            // Priority 3: Try to format as number
            const n = Number(num);
            if (isNaN(n)) return num; // Fallback to original if NaN
            return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        };

        const formatCaseId = (num) => `#${String(num).padStart(3, '0')}`;

        const parseCSVLine = (text) => {
            const result = []; let cell = ''; let insideQuote = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') { if (i + 1 < text.length && text[i + 1] === '"') { cell += '"'; i++; } else { insideQuote = !insideQuote; } } 
                else if (char === ',' && !insideQuote) { result.push(cell); cell = ''; } else { cell += char; }
            }
            result.push(cell); return result;
        };

        const extractDatesFromSchedule = (scheduleStr) => {
            if (!scheduleStr) return [];
            const regex = /\b(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})\b/g; 
            const matches = []; let match;
            while ((match = regex.exec(scheduleStr)) !== null) {
                const d = new Date(match[0].replace(/\//g, '-')); 
                if (!isNaN(d.getTime())) matches.push(d);
            }
            return matches;
        };

        const sortScheduleLines = (lines) => {
            return [...lines].sort((a, b) => {
                const datesA = extractDatesFromSchedule(a); const datesB = extractDatesFromSchedule(b);
                const dateA = datesA.length > 0 ? datesA[0] : null; const dateB = datesB.length > 0 ? datesB[0] : null;
                if (dateA && dateB) return dateA - dateB; if (dateA) return -1; if (dateB) return 1; return 0; 
            });
        };

        const getPaymentStatus = (record) => {
            if (record.status === '4') return { isPaid: true, isOverdue: false }; 
            const dates = extractDatesFromSchedule(record.schedule);
            const now = new Date(); const currentMonth = now.getMonth(); const currentYear = now.getFullYear();
            let isPaidThisMonth = false;
            for (let d of dates) { if (d.getMonth() === currentMonth && d.getFullYear() === currentYear) { isPaidThisMonth = true; break; } }
            if (!isPaidThisMonth && record.lastRepaymentDate) { const lastDate = new Date(record.lastRepaymentDate); if (lastDate.getMonth() === currentMonth && lastDate.getFullYear() === currentYear) isPaidThisMonth = true; }
            if (record.status === '0') return { isPaid: true, isOverdue: false };
            let repayDay = null; if (record.repayDay) { const match = String(record.repayDay).match(/(\d+)/); if (match) repayDay = parseInt(match[1], 10); }
            let isOverdue = false; if (!isPaidThisMonth && repayDay) { const currentDay = now.getDate(); if (currentDay >= repayDay) isOverdue = true; }
            return { isPaid: isPaidThisMonth, isOverdue };
        };

        const calculateDerivedData = (record) => {
            if (record.status === '2' || record.status === '4') return { outstanding: 0, arrears: 0, remainingTerms: '-', roiTerms: '-' };
            const loanAmount = Number(record.loanAmount) || 0; const disbursed = Number(record.disbursed) || 0;
            const totalPrincipalPaid = Number(record.actualReceivedMonth) || 0; const totalInterestPaid = Number(record.actualInterestMonth) || 0;  
            let outstanding = disbursed - totalPrincipalPaid - totalInterestPaid; if (outstanding < 0) outstanding = 0; 
            const arrears = loanAmount - totalPrincipalPaid; let remainingTerms = '-'; let roiTerms = "-";
            const method = record.method || ''; const isSpecialMethod = ['設定', '票貼', '小額'].includes(method);
            if (!isSpecialMethod) {
                const terms = Number(record.terms) || 0; const repaidTerms = Number(record.repaidTerms) || 0;
                let val = terms - repaidTerms; if (val < 0) val = 0; remainingTerms = Math.floor(val); 
                const termPrincipal = Number(record.principalPerTerm) || 0; const termInterest = Number(record.interestPerTerm) || 0; const termTotal = termPrincipal + termInterest;
                if (record.status === '3') roiTerms = "∞"; else if (record.status === '1') { if (termTotal > 0 && outstanding > 0) { let val = outstanding / termTotal; if (val < 0) val = 0; roiTerms = val.toFixed(1); } else if (outstanding <= 0) roiTerms = "0"; }
            }
            return { outstanding, arrears, remainingTerms, roiTerms };
        };

        const getStatusLabel = (status) => {
            switch(String(status)) {
                case '0': return { text: '結案', color: 'bg-gray-100 text-gray-600' };
                case '1': return { text: '進行中', color: 'bg-emerald-100 text-emerald-600' };
                case '2': return { text: '代管中', color: 'bg-blue-100 text-blue-600' };
                case '3': return { text: '呆帳', color: 'bg-red-100 text-red-600' };
                case '4': return { text: '結案(呆)', color: 'bg-orange-100 text-orange-600' };
                default: return { text: status, color: 'bg-gray-100 text-gray-600' };
            }
        };

        // --- AI Service ---
        window.callGemini = async (prompt) => {
            if (!apiKey) {
                await new Promise(r => setTimeout(r, 1200)); 
                if (prompt.includes("診斷報告")) return `**[AI 財務診斷報告 (模擬)]**\n\n基於您的數據...\n1. 營運狀況良好 (8/10)\n2. 注意呆帳風險\n3. 建議定期追蹤逾期案件`;
                if (prompt.includes("簡訊")) return `[測試簡訊] 親愛的客戶您好...`;
                return "AI 模擬回應：系統運作正常。請設定 API Key。";
            }
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "AI 暫時無法回應。";
            } catch (e) { return "連線錯誤"; }
        };

        // --- Logic ---
        const updateState = (updates) => { Object.assign(state, updates); renderApp(); };

        const calculateStats = () => {
            const s = { totalIncome: 0, creditAmount: 0, outstanding: 0, monthCollected: 0, monthInterestCollected: 0, monthDue: 0, monthInterestDue: 0, borrowers: 0, badDebts: 0, badDebtAmount: 0, currentLent: 0, monthDiff: 0, monthInterestDiff: 0, totalManagementFee: 0, closedCases: 0, activeCases: 0, unpaidCount: 0, unpaidRecords: [], closedRecords: [], activeRecords: [], badDebtCases: [] };
            const uniqueBorrowers = new Set();
            state.records.forEach(r => {
                const calc = calculateDerivedData(r); const principal = Number(r.principalPerTerm) || 0; const termInterest = Number(r.interestPerTerm) || 0;
                if (r.status === '1' || r.status === '2') { s.monthDue += (principal + termInterest); if (r.status === '1') s.monthInterestDue += termInterest; }
                const { isPaid, isOverdue } = getPaymentStatus(r);
                if (isPaid && r.status !== '0' && r.status !== '4') { s.monthCollected += (Number(r.actualReceivedMonth) || 0) + (Number(r.actualInterestMonth) || 0); s.monthInterestCollected += (Number(r.actualInterestMonth) || 0); }
                s.totalIncome += (Number(r.totalInterestIncome) || 0);
                if (r.status !== '2') s.outstanding += calc.outstanding;
                if (r.status === '1' || r.status === '3') s.creditAmount += calc.arrears;
                if (r.status === '1' || r.status === '3') s.currentLent += Number(r.disbursed) || 0;
                if (r.status === '2') { s.hasManagedCases = true; s.totalManagementFee += termInterest; }
                if (r.borrower) uniqueBorrowers.add(r.borrower);
                if (r.status === '0' || r.status === '4') { s.closedCases += 1; s.closedRecords.push(r); s.badDebtCases.push(r); if (r.status === '4') s.badDebtAmount += calc.arrears; } 
                else { if (r.status === '3') { s.badDebts += 1; s.badDebtAmount += calc.arrears; s.badDebtCases.push(r); } else { s.activeCases += 1; s.activeRecords.push(r); } if (isOverdue && r.status !== '3') { s.unpaidCount += 1; s.unpaidRecords.push(r); } }
            });
            s.totalIncome -= s.badDebtAmount; s.monthInterestDiff = s.monthInterestDue - s.monthInterestCollected; s.monthDiff = s.monthDue - s.monthCollected; s.borrowers = uniqueBorrowers.size;
            return s;
        };

        const getCardConfig = (id) => {
            const stats = calculateStats(); if (!stats) return null;
            const config = {
                totalIncome: { label: "總收入 (累計)", value: stats.totalIncome, type: "primary", icon: "wallet", isCurrency: true, width: 2 },
                creditAmount: { label: "債權總額", value: stats.creditAmount, type: "primary", icon: "file-text", isCurrency: true, width: 1 },
                outstanding: { label: "在外本金", value: stats.outstanding, type: "warning", icon: "dollar-sign", isCurrency: true, width: 1 },
                currentLent: { label: "目前放款額", value: stats.currentLent, type: "warning", icon: "credit-card", isCurrency: true, width: 1 },
                monthDue: { label: "本月應收款", value: stats.monthDue, type: "primary", icon: "credit-card", compact: true, isCurrency: true, width: 1 },
                monthCollected: { label: "本月已收款", value: stats.monthCollected, type: "primary", icon: "check", compact: true, isCurrency: true, width: 1 },
                monthDiff: { label: "本月款差", value: stats.monthDiff, type: "critical", icon: "alert-circle", compact: true, isCurrency: true, width: 1 },
                monthInterestDiff: { label: "本月息差", value: stats.monthInterestDiff, type: "critical", icon: "alert-circle", compact: true, isCurrency: true, width: 1 },
                monthInterestDue: { label: "本月應收息", value: stats.monthInterestDue, type: "primary", icon: "trending-up", compact: true, isCurrency: true, width: 1 },
                monthInterestCollected: { label: "本月已收息", value: stats.monthInterestCollected, type: "primary", icon: "check", compact: true, isCurrency: true, width: 1 },
                totalManagementFee: { label: "本月管理費", value: stats.totalManagementFee, type: "primary", icon: "credit-card", isCurrency: true, width: 1 },
                badDebtAmount: { label: "呆帳金額", value: stats.badDebtAmount, type: "critical", icon: "x", isCurrency: true, width: 1 },
                badDebts: { label: "呆帳人數", value: stats.badDebts, type: "critical", icon: "users", isCurrency: false, width: 1 }
            };
            if (id === 'totalManagementFee' && !stats.hasManagedCases) return null;
            return config[id];
        };

        // --- Window Exposed Functions ---
        window.setActiveTab = (tab) => updateState({ activeTab: tab, modalType: null });
        window.updateState = (updates) => updateState(updates);

        window.toggleAuthMode = () => {
            updateState({ isRegistering: !state.isRegistering });
        };

        window.handleAuth = async (e) => {
            e.preventDefault();
            if (!firebaseAvailable) { alert("Firebase 未設定，僅能使用試用模式"); return; }
            
            const usernameInput = document.getElementById('authUsername').value.trim();
            const passwordInput = document.getElementById('authPassword').value;
            
            updateState({ authLoading: true });

            try {
                if (state.isRegistering) {
                    const emailInput = document.getElementById('authEmail').value.trim();
                    const confirmPass = document.getElementById('authConfirmPassword').value;
                    
                    if (passwordInput !== confirmPass) throw new Error("兩次輸入的密碼不一致");
                    
                    // 1. Check if username exists
                    const userDirRef = doc(db, 'artifacts', appId, 'public', 'data', 'user_directory', usernameInput);
                    const userDoc = await getDoc(userDirRef);
                    if (userDoc.exists()) throw new Error("此帳號已被使用，請更換一個");

                    // 2. Create Auth User
                    const userCredential = await createUserWithEmailAndPassword(auth, emailInput, passwordInput);
                    const user = userCredential.user;
                    await updateProfile(user, { displayName: usernameInput });

                    // 3. Save Directory Mapping
                    await setDoc(userDirRef, {
                        email: emailInput,
                        uid: user.uid,
                        username: usernameInput,
                        createdAt: serverTimestamp()
                    });

                } else {
                    // Login Logic
                    const userDirRef = doc(db, 'artifacts', appId, 'public', 'data', 'user_directory', usernameInput);
                    const userDoc = await getDoc(userDirRef);
                    
                    if (!userDoc.exists()) {
                         // Fallback: try login as email directly
                         if (usernameInput.includes('@')) {
                             await signInWithEmailAndPassword(auth, usernameInput, passwordInput);
                         } else {
                             throw new Error("找不到此帳號");
                         }
                    } else {
                        const targetEmail = userDoc.data().email;
                        await signInWithEmailAndPassword(auth, targetEmail, passwordInput);
                    }
                }
            } catch (err) {
                alert(err.message);
                updateState({ authLoading: false });
            }
        };

        window.handleLogout = async () => {
            if (firebaseAvailable) { try { await signOut(auth); } catch (e) { console.error(e); } }
            updateState({ currentUser: null, isDemoMode: false, records: [] });
            window.location.reload(); 
        };
        
        window.openNewForm = () => { formData = { ...initialFormState }; updateState({ editingRecord: null, activeTab: 'form' }); };
        window.startEdit = (id) => { const record = state.records.find(r => r.id === id); if (record) { formData = { ...record }; updateState({ editingRecord: record, activeTab: 'form' }); } };
        window.handleSearch = (val) => updateState({ searchTerm: val, currentPage: 1 });
        window.changePage = (delta) => updateState({ currentPage: state.currentPage + delta });

        window.updateFormData = (key, val) => {
            formData[key] = val;
            const loan = Number(formData.loanAmount) || 0;
            const t = Number(formData.terms) || 0;
            const interestRate = (parseFloat(formData.interestRate) || 0) / 100;
            const specialRate = (parseFloat(formData.specialRate) || 0) / 100;
            if (key === 'loanAmount' || key === 'terms' || key === 'status' || key === 'method') {
                 if (formData.status === '2') { formData.principalPerTerm = 0; }
                 else if ((formData.status === '1' || formData.method === '叨簿子') && t > 0) formData.principalPerTerm = Math.round(loan / t);
                 else if (['3','4','0'].includes(formData.status)) formData.principalPerTerm = 0;
                 if (['設定', '票貼', '小額'].includes(formData.method)) { formData.principalPerTerm = 0; formData.terms = 0; }
            }
            if (key === 'status' || key === 'loanAmount' || key === 'interestRate' || key === 'specialRate') {
                if (['3','4','0'].includes(formData.status)) { formData.interestPerTerm = 0; formData.managementFee = 0; }
                else if (formData.status === '2') { formData.interestPerTerm = Math.round(loan * interestRate); formData.managementFee = Math.round(loan * specialRate); }
                else { formData.interestPerTerm = Math.round(loan * interestRate); formData.managementFee = 0; }
            }
            renderApp();
        };

        window.handleSaveForm = async () => {
             if (!state.currentUser && !state.isDemoMode) { alert("請先登入"); return; }
             const dataToSave = { ...formData, updatedAt: serverTimestamp() };
             if (!dataToSave.outstandingPrincipal) dataToSave.outstandingPrincipal = dataToSave.loanAmount;
             if (state.isDemoMode) {
                 if (!state.editingRecord) {
                     const newRec = { ...dataToSave, id: `new_${Date.now()}`, caseNumber: formatCaseId(state.records.length + 1), createdAt: serverTimestamp() };
                     state.records.push(newRec);
                 } else {
                     const idx = state.records.findIndex(r => r.id === state.editingRecord.id);
                     if (idx !== -1) state.records[idx] = { ...state.records[idx], ...dataToSave };
                 }
             } else if (firebaseAvailable) {
                 const colRef = collection(db, 'artifacts', appId, 'users', state.currentUser, 'loan_records');
                 if (!state.editingRecord) {
                     dataToSave.caseNumber = formatCaseId(state.records.length + 1);
                     dataToSave.createdAt = serverTimestamp();
                     await addDoc(colRef, dataToSave);
                 } else {
                     await updateDoc(doc(colRef, state.editingRecord.id), dataToSave);
                 }
             }
             window.setActiveTab('list');
        };

        window.handleDelete = async (id) => {
            if (!confirm("確定要刪除嗎？")) return;
            if (state.isDemoMode) { state.records = state.records.filter(r => r.id !== id); renderApp(); } 
            else if (firebaseAvailable) { await deleteDoc(doc(db, 'artifacts', appId, 'users', state.currentUser, 'loan_records', id)); }
        };

        window.updateRepaymentSearch = (val) => updateState({ repaymentSearchTerm: val, selectedRepaymentId: '' });
        window.handleRepaymentSelect = (id) => {
            const record = state.records.find(r => r.id === id);
            if (record) {
                const { isPaid } = getPaymentStatus(record);
                updateState({
                    selectedRepaymentId: id,
                    repaymentSearchTerm: '',
                    repaymentPrincipal: isPaid || record.status === '2' ? 0 : (record.principalPerTerm || 0),
                    repaymentInterest: isPaid ? 0 : (record.interestPerTerm || 0)
                });
            }
        };
        window.resetRepaymentSelection = () => updateState({ selectedRepaymentId: '', repaymentPrincipal: '', repaymentInterest: '' });
        window.submitRepayment = async () => {
             const record = state.records.find(r => r.id === state.selectedRepaymentId); if (!record) return;
             const currentSchedule = record.schedule || '';
             const newLines = [...(currentSchedule.split('\n').filter(x=>x.trim())), state.repaymentDate];
             const sortedSchedule = sortScheduleLines(newLines).join('\n');
             const data = {
                 actualReceivedMonth: (Number(record.actualReceivedMonth)||0) + Number(state.repaymentPrincipal),
                 actualInterestMonth: (Number(record.actualInterestMonth)||0) + Number(state.repaymentInterest),
                 repaidTerms: (Number(record.repaidTerms)||0) + 1,
                 totalInterestIncome: (Number(record.totalInterestIncome)||0) + Number(state.repaymentInterest),
                 schedule: sortedSchedule,
                 lastRepaymentDate: state.repaymentDate,
                 updatedAt: serverTimestamp()
             };
             if (state.isDemoMode) {
                 const idx = state.records.findIndex(r => r.id === record.id); if (idx !== -1) state.records[idx] = { ...state.records[idx], ...data }; renderApp();
             } else if (firebaseAvailable) { await updateDoc(doc(db, 'artifacts', appId, 'users', state.currentUser, 'loan_records', record.id), data); }
             alert("入帳成功！"); window.resetRepaymentSelection();
        };

        window.openModalList = (type) => updateState({ modalType: type });
        window.openAIAdvisor = async () => {
            updateState({ showAIModal: true, aiLoading: true, aiReport: '' });
            const stats = calculateStats();
            const prompt = `角色：專業私人財務顧問。請根據數據生成繁體中文診斷報告：總收入$${stats.totalIncome}，呆帳$${stats.badDebtAmount}，逾期${stats.unpaidCount}筆。請給出評分與建議。`;
            setTimeout(async () => {
                const report = await window.callGemini(prompt);
                updateState({ aiReport: report, aiLoading: false });
            }, 500);
        };
        
        window.openMessageModal = (id) => { const r = state.records.find(rec => rec.id === id); updateState({ messageModalRecord: r, aiLoading: true, aiMessage: '' }); window.generateMessage('polite'); };
        window.generateMessage = async (tone) => { if (!state.messageModalRecord) return; updateState({ aiLoading: true }); const r = state.messageModalRecord; const prompt = `寫一則${tone==='polite'?'委婉':tone==='firm'?'堅定':'嚴厲'}的催收簡訊給${r.borrower}，金額$${(Number(r.principalPerTerm)+Number(r.interestPerTerm))}`; const msg = await window.callGemini(prompt); updateState({ aiMessage: msg, aiLoading: false }); };
        window.openModal = (type, id) => { const r = state.records.find(rec => rec.id === id); updateState({ activeModal: { type, record: r } }); };
        window.saveModalData = async (id, type) => {
             const val = document.getElementById('modalTextarea').value; let data = {};
             if (type === 'note') data.note = val;
             else {
                 const lines = val.split('\n').filter(l => l.trim() !== '');
                 const sorted = sortScheduleLines(lines).join('\n');
                 data.schedule = sorted;
                 const r = state.records.find(rec => rec.id === id);
                 const count = extractDatesFromSchedule(sorted).length;
                 const dates = extractDatesFromSchedule(sorted);
                 let latestDate = null;
                 if (dates.length > 0) { dates.sort((a, b) => b - a); latestDate = dates[0].toISOString().split('T')[0]; }
                 data.repaidTerms = count;
                 data.totalInterestIncome = count * (Number(r.interestPerTerm)||0);
                 data.actualReceivedMonth = count * (Number(r.principalPerTerm)||0); 
                 if(latestDate) data.lastRepaymentDate = latestDate;
             }
             if (state.isDemoMode) { const idx = state.records.findIndex(r => r.id === id); if (idx !== -1) state.records[idx] = { ...state.records[idx], ...data }; renderApp(); } 
             else if (firebaseAvailable) { await updateDoc(doc(db, 'artifacts', appId, 'users', state.currentUser, 'loan_records', id), data); }
             updateState({ activeModal: { type: null, record: null } });
        };
        window.handlePaymentStatusClick = (id) => { window.handleRepaymentSelect(id); updateState({ activeTab: 'repayment' }); };
        window.enterDemoMode = () => { updateState({ isDemoMode: true, currentUser: 'Guest' }); };

        // --- Render Views ---

        const renderAuth = () => {
            const isReg = state.isRegistering;
            return `

                    <div class="text-center mb-8"><div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 mb-4"><i data-lucide="wallet" class="w-8 h-8 text-blue-600"></i></div><h2 class="text-2xl font-bold text-gray-800">${isReg ? "註冊新帳號" : "登入財務系統"}</h2><p class="text-xs text-gray-500 mt-2">${isReg ? "設定您的專屬帳號ID與綁定Email" : "使用您的帳號ID登入"}</p></div>
                    <form onsubmit="window.handleAuth(event)" class="space-y-6">
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">帳號 (ID)</label><div class="relative"><span class="absolute left-3 top-3 text-gray-400"><i data-lucide="user" class="w-5 h-5"></i></span><input type="text" id="authUsername" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="請輸入帳號" required></div></div>
                        ${isReg ? `<div><label class="block text-sm font-medium text-gray-700 mb-1">綁定 Email</label><div class="relative"><span class="absolute left-3 top-3 text-gray-400"><i data-lucide="at-sign" class="w-5 h-5"></i></span><input type="email" id="authEmail" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="name@example.com" required></div></div>` : ''}
                        <div><label class="block text-sm font-medium text-gray-700 mb-1">密碼</label><div class="relative"><span class="absolute left-3 top-3 text-gray-400"><i data-lucide="lock" class="w-5 h-5"></i></span><input type="password" id="authPassword" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••••" required></div></div>
                        ${isReg ? `<div><label class="block text-sm font-medium text-gray-700 mb-1">確認密碼</label><div class="relative"><span class="absolute left-3 top-3 text-gray-400"><i data-lucide="lock" class="w-5 h-5"></i></span><input type="password" id="authConfirmPassword" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="再次輸入密碼" required></div></div>` : ''}
                        
                        <button type="submit" ${state.authLoading ? 'disabled' : ''} class="w-full text-white ${isReg ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-blue-600 hover:bg-blue-700'} py-3 rounded-lg font-bold transition-all shadow-md flex justify-center items-center disabled:opacity-50">
                            ${state.authLoading ? '<i data-lucide="refresh-cw" class="w-5 h-5 mr-2 animate-spin"></i>' : (isReg ? '<i data-lucide="user-plus" class="w-5 h-5 mr-2"></i> 立即註冊' : '<i data-lucide="log-in" class="w-5 h-5 mr-2"></i> 登入系統')}
                        </button>
                    </form>
                    <div class="mt-6 text-center text-sm space-y-4">
                        <div><span class="text-gray-500">${isReg ? "已經有帳號了嗎？" : "還沒有帳號嗎？"}</span><button onclick="window.toggleAuthMode()" class="ml-2 text-blue-600 hover:text-blue-800 font-bold hover:underline focus:outline-none">${isReg ? "直接登入" : "註冊新帳號"}</button></div>
                        <div class="pt-2 border-t border-gray-100"><button onclick="window.enterDemoMode()" class="text-gray-400 hover:text-gray-600 text-xs flex items-center justify-center w-full hover:underline"><i data-lucide="log-in" class="w-3 h-3 mr-1"></i> 先行試用 (免登入/不儲存資料)</button></div>
                    </div>
                </div>
            </div>`;
        };

        const renderDashboard = (stats) => {
             const cards = [
                { id: 'totalIncome', label: "總收入 (累計)", value: stats.totalIncome, type: "primary", icon: "wallet", isCurrency: true, width: 2 },
                { id: 'creditAmount', label: "債權總額", value: stats.creditAmount, type: "primary", icon: "file-text", isCurrency: true, width: 1 },
                { id: 'outstanding', label: "在外本金", value: stats.outstanding, type: "warning", icon: "dollar-sign", isCurrency: true, width: 1 },
                { id: 'currentLent', label: "目前放款額", value: stats.currentLent, type: "warning", icon: "credit-card", isCurrency: true, width: 1 },
                { id: 'monthDue', label: "本月應收款", value: stats.monthDue, type: "primary", icon: "credit-card", compact: true, isCurrency: true, width: 1 },
                { id: 'monthCollected', label: "本月已收款", value: stats.monthCollected, type: "primary", icon: "check", compact: true, isCurrency: true, width: 1 },
                { id: 'monthDiff', label: "本月款差", value: stats.monthDiff, type: "critical", icon: "alert-circle", compact: true, isCurrency: true, width: 1 },
                { id: 'monthInterestDiff', label: "本月息差", value: stats.monthInterestDiff, type: "critical", icon: "alert-circle", compact: true, isCurrency: true, width: 1 },
                { id: 'monthInterestDue', label: "本月應收息", value: stats.monthInterestDue, type: "primary", icon: "trending-up", compact: true, isCurrency: true, width: 1 },
                { id: 'monthInterestCollected', label: "本月已收息", value: stats.monthInterestCollected, type: "primary", icon: "check", compact: true, isCurrency: true, width: 1 },
                { id: 'totalManagementFee', label: "本月管理費", value: stats.totalManagementFee, type: "primary", icon: "credit-card", isCurrency: true, width: 1 },
                { id: 'badDebtAmount', label: "呆帳金額", value: stats.badDebtAmount, type: "critical", icon: "x", isCurrency: true, width: 1 },
                { id: 'badDebts', label: "呆帳人數", value: stats.badDebts, type: "critical", icon: "users", isCurrency: false, width: 1 }
            ];

            const getStyle = (type) => {
                switch (type) {
                    case 'primary': return { bg: "bg-emerald-100", border: "border-emerald-300", text: "text-emerald-900", iconBg: "bg-emerald-200", iconColor: "text-emerald-700" };
                    case 'danger': return { bg: "bg-rose-50", border: "border-rose-200", text: "text-rose-900", iconBg: "bg-rose-100", iconColor: "text-rose-600" };
                    case 'warning': return { bg: "bg-amber-50", border: "border-amber-200", text: "text-amber-900", iconBg: "bg-amber-100", iconColor: "text-amber-600" };
                    case 'critical': return { bg: "bg-red-200", border: "border-red-300", text: "text-red-900", iconBg: "bg-red-300", iconColor: "text-red-700" };
                    default: return { bg: "bg-gray-50", border: "border-gray-200", text: "text-gray-900", iconBg: "bg-gray-100", iconColor: "text-gray-600" };
                }
            };

            const cardsHtml = cards.filter(c => c.id !== 'totalManagementFee' || stats.hasManagedCases).map(c => {
                const s = getStyle(c.type);
                const colSpan = c.width === 2 ? 'lg:col-span-2' : 'lg:col-span-1';
                return `<div class="${s.bg} ${colSpan} border ${s.border} rounded-xl p-3 shadow-sm relative overflow-hidden flex flex-col justify-between h-full cursor-pointer hover:shadow-md transition-transform hover:scale-[1.01]" onclick="window.openModalList('${c.id}')">
                    <div class="flex justify-between items-start z-10"><span class="text-base font-bold text-gray-700">${c.label}</span><div class="p-1.5 rounded-lg ${s.iconBg}"><i data-lucide="${c.icon}" class="w-4 h-4 ${s.iconColor}"></i></div></div>

                </div>`;
            }).join('');

            return `<div class="animate-fade-in space-y-6">
                <header class="flex justify-between items-center mb-6"><div><h2 class="text-2xl font-bold text-gray-800">財務營運儀表板</h2></div>${state.isDemoMode ? '<div class="bg-amber-100 text-amber-800 px-3 py-1 rounded-full text-xs font-bold">試用模式</div>' : ''}</header>
                <div class="grid grid-cols-1 lg:grid-cols-4 gap-3">
                    <div class="lg:col-span-3 grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-3">${cardsHtml}</div>
                    <div class="flex flex-col gap-3">
                        <div class="bg-gradient-to-br from-teal-600 to-cyan-700 rounded-xl p-4 shadow-lg border border-transparent flex flex-col justify-center relative overflow-hidden flex-1 min-h-[300px]">
                            <div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full -mr-10 -mt-10 blur-xl"></div><div class="absolute bottom-0 left-0 w-24 h-24 bg-black/10 rounded-full -ml-10 -mb-10 blur-xl"></div>
                            <div class="flex items-center mb-4 relative z-10 border-b border-white/20 pb-2"><i data-lucide="database" class="w-6 h-6 text-white mr-2"></i><h3 class="font-bold text-white text-xl tracking-wide">系統案件狀態</h3></div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 relative z-10 flex-1">
                                <div onclick="window.openModalList('active')" class="bg-emerald-100 backdrop-blur-sm p-3 rounded-xl text-center cursor-pointer hover:bg-emerald-200 transition-all border border-emerald-300 group flex flex-col justify-center"><span class="block text-4xl font-extrabold text-emerald-800 mb-1 group-hover:scale-110 transition-transform">${formatNumber(stats.activeCases)}</span><span class="text-base text-emerald-700 font-bold uppercase tracking-wider">進行中</span></div>
                                <div onclick="window.openModalList('unpaid')" class="bg-red-200 p-3 rounded-xl text-center cursor-pointer hover:bg-red-300 transition-all shadow-md group flex flex-col justify-center"><span class="block text-4xl font-extrabold text-red-800 mb-1 group-hover:scale-110 transition-transform">${formatNumber(stats.unpaidCount)}</span><span class="text-lg text-red-700 font-bold uppercase tracking-wider flex items-center justify-center"><i data-lucide="alert-triangle" class="w-4 h-4 mr-1 animate-pulse"></i>本期逾期</span></div>
                                <div onclick="window.openModalList('closed')" class="bg-gray-200 p-3 rounded-xl text-center cursor-pointer hover:bg-gray-300 transition-all border border-gray-300 flex flex-col justify-center"><span class="block text-4xl font-bold text-gray-800 mb-1">${formatNumber(stats.closedCases)}</span><span class="text-lg text-gray-600 font-bold uppercase tracking-wider">結案</span></div>
                                <div onclick="window.openModalList('badDebt')" class="bg-pink-300 p-3 rounded-xl text-center cursor-pointer hover:bg-pink-400 transition-all shadow-md group flex flex-col justify-center"><span class="block text-4xl font-extrabold text-pink-900 mb-1 group-hover:scale-110 transition-transform">${formatNumber(stats.badDebts + stats.closedCases)}</span><span class="text-lg text-pink-800 font-bold uppercase tracking-wider">呆帳</span></div>
                            </div>
                        </div>
                        <div class="h-40 cursor-pointer" onclick="window.openAIAdvisor()"><div class="bg-gradient-to-br from-indigo-600 to-purple-700 rounded-xl p-6 text-white shadow-lg relative overflow-hidden h-full flex flex-col items-center justify-center hover:shadow-xl hover:scale-[1.02] transition-all group"><div class="absolute top-0 right-0 w-24 h-24 bg-white/10 rounded-full -mr-10 -mt-10 blur-xl group-hover:bg-white/20 transition-all"></div><div class="relative z-10 flex flex-col items-center justify-center"><i data-lucide="sparkles" class="w-8 h-8 mb-2 text-yellow-300 animate-pulse"></i><h3 class="text-lg font-bold text-center">AI 財務顧問</h3><span class="text-xs opacity-80 mt-1 group-hover:opacity-100 transition-opacity">點擊開啟診斷報告</span></div></div></div>
                    </div>
                </div>
            </div>`;
        };

        const renderList = () => {
             const filtered = state.records.filter(r => (r.borrower?.includes(state.searchTerm) || r.agent?.includes(state.searchTerm) || r.displayId?.includes(state.searchTerm)));
            const totalPages = Math.ceil(filtered.length / state.itemsPerPage);
            const currentRecords = filtered.slice((state.currentPage - 1) * state.itemsPerPage, state.currentPage * state.itemsPerPage);

            const fieldDefinitions = [
                { key: 'caseNumber', label: '編號', bg: 'bg-gray-100', width: 'w-20' },
                { key: 'borrower', label: '借款人', font: 'font-bold', width: 'w-24' },
                { key: 'status', label: '狀態', width: 'w-20' },
                { key: 'method', label: '方式' },
                { key: 'date', label: '放款日期' },
                { key: 'job', label: '工作' },
                { key: 'loanAmount', label: '借款金額', isCurrency: true },
                { key: 'disbursed', label: '放款金額', isCurrency: true },
                { key: 'interestRate', label: '利率(%)', isCurrency: false },
                { key: 'agent', label: '銀行/人' },
                { key: 'terms', label: '期數' },
                { key: 'repayDay', label: '每期還款日' },
                { key: 'principalPerTerm', label: '每期還款本金', isCurrency: true },
                { key: 'interestPerTerm', label: '每期利息', isCurrency: true },
                { key: 'repaidTerms', label: '還款期數(次)' },
                { key: 'remainingTerms', label: '餘期', isComputed: true },
                { key: 'roiTerms', label: '回本期數', isComputed: true },
                { key: 'arrears', label: '欠款', isCurrency: true, isDanger: true, isComputed: true },
                { key: 'outstanding', label: '在外本金', isCurrency: true, isComputed: true },
                { key: 'totalInterestIncome', label: '利息收入', isCurrency: true },
                { key: 'paymentStatus', label: '本月繳款狀態', isComputed: true },
                { key: 'note', label: '附註', isEditable: true },
                { key: 'schedule', label: '還款日程紀錄', isEditable: true },
                { key: 'actions', label: '操作', isAction: true }
            ];

            let rowsHtml = '';
            if (filtered.length === 0) {
                rowsHtml = `<tr><td colspan="${fieldDefinitions.length}" class="p-8 text-center text-gray-400">目前無資料，請點擊左側「匯入 CSV」建立資料庫</td></tr>`;
            } else {
                rowsHtml = currentRecords.map(r => {
                    const { isPaid, isOverdue } = getPaymentStatus(r);
                    const calc = calculateDerivedData(r);
                    const statusLbl = getStatusLabel(r.status);
                    
                    return `<tr class="hover:bg-gray-50 transition-colors">` + fieldDefinitions.map((field, idx) => {
                        let content = '';
                        let val = r[field.key];
                        if (field.isComputed) {
                            if (field.key === 'paymentStatus') {
                                content = `<div onclick="window.handlePaymentStatusClick('${r.id}')" class="flex items-center justify-center cursor-pointer p-2 rounded transition-colors ${isPaid ? 'hover:bg-emerald-200' : 'hover:bg-red-100'}" title="點擊前往還款頁面">${isPaid ? `<span class="text-emerald-600 font-bold flex items-center"><i data-lucide="check" class="w-3 h-3 mr-1"></i>已繳清</span>` : `<span class="font-bold flex items-center ${isOverdue ? 'text-red-700' : 'text-red-600'}">${isOverdue ? '<i data-lucide="alert-triangle" class="w-3 h-3 mr-1"></i>逾期未繳' : '未繳'}</span>`}</div>`;
                            } else if (field.key === 'remainingTerms') content = calc.remainingTerms;
                            else if (field.key === 'roiTerms') content = calc.roiTerms;
                            else if (field.key === 'arrears') content = `<span class="font-mono ${Number(calc.arrears)>0?'text-red-600 font-bold':''}">${formatNumber(calc.arrears)}</span>`;
                            else if (field.key === 'outstanding') content = `<span class="font-mono font-bold">${formatNumber(calc.outstanding)}</span>`;
                        } else if (field.isAction) {
                            content = `<div class="flex space-x-2 justify-center items-center"><button onclick="window.openMessageModal('${r.id}')" class="text-purple-600 hover:text-purple-800 bg-purple-50 p-1 rounded" title="AI 催收"><i data-lucide="sparkles" class="w-4 h-4"></i></button><button onclick="window.startEdit('${r.id}')" class="text-blue-600 hover:text-blue-800 bg-blue-50 p-1 rounded" title="編輯"><i data-lucide="edit-2" class="w-4 h-4"></i></button><button onclick="window.handleDelete('${r.id}')" class="flex items-center px-2 py-1 bg-red-100 text-red-700 rounded hover:bg-red-200 text-xs font-bold" title="刪除整筆案件"><i data-lucide="trash-2" class="w-3 h-3 mr-1"></i>刪除</button></div>`;
                        } else if (field.key === 'status') {
                            content = `<span class="px-2 py-1 rounded text-xs ${statusLbl.color}">${statusLbl.text}</span>`;
                        } else if (field.isEditable) {
                            const icon = field.key === 'note' ? 'file-pen-line' : 'calendar-days';
                            content = `<button onclick="window.openModal('${field.key}', '${r.id}')" class="flex items-center justify-center text-gray-500 hover:text-blue-600 bg-gray-100 hover:bg-blue-50 px-3 py-1 rounded-md text-xs transition-colors mx-auto"><i data-lucide="${icon}" class="w-3 h-3 mr-1"></i>檢視/編輯</button>`;
                        } else {
                            content = `<span class="${field.isCurrency ? 'font-mono' : ''} ${field.isDanger && Number(val) > 0 ? 'text-red-600 font-bold' : 'text-gray-700'}">${field.isCurrency ? '$' : ''}${formatNumber(val)}</span>`;
                        }
                        let stickyClass = '';
                        let style = `min-width: ${idx===0?'80px':(idx===1?'100px':'90px')}; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;`;
                        if (idx <= 1) { stickyClass = `sticky z-20 bg-white ${idx === 0 ? 'left-0' : 'left-[80px]'}`; }
                        if (field.key === 'paymentStatus' && isOverdue) stickyClass += ' bg-emerald-100'; 

                        return `<td class="py-1.5 px-1 border-r border-gray-200 text-xs text-center ${field.font || ''} ${stickyClass}" style="${style}" title="${val||''}">${content}</td>`;
                    }).join('') + `</tr>`;
                }).join('');
            }
            return `
            <div class="flex flex-col h-[calc(100vh-6rem)] animate-fade-in space-y-4">
                <header class="flex flex-col sm:flex-row justify-between items-center gap-4 shrink-0 bg-slate-100 pt-2 pb-2 z-10">
                    <h2 class="text-2xl font-bold text-gray-800">案件資料列表</h2>
                    <div class="flex space-x-2 items-center w-full sm:w-auto">
                        <div class="relative flex-1 sm:w-64"><i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4"></i><input type="text" id="searchInput" placeholder="搜尋編號、姓名..." value="${state.searchTerm}" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none" oninput="window.handleSearch(this.value)"></div>
                        <button onclick="window.openNewForm()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 flex items-center shadow-sm"><i data-lucide="plus" class="w-4 h-4 mr-2"></i>新增</button>
                        <div class="flex items-center space-x-1 ml-2"><span class="text-sm text-gray-500 mr-2">Page ${state.currentPage} of ${Math.ceil(filtered.length / state.itemsPerPage) || 1}</span><button onclick="window.changePage(-1)" ${state.currentPage === 1 ? 'disabled' : ''} class="p-2 rounded hover:bg-gray-200 disabled:opacity-30 transition-colors"><i data-lucide="chevron-left" class="w-5 h-5 text-gray-600"></i></button><button onclick="window.changePage(1)" ${state.currentPage >= Math.ceil(filtered.length / state.itemsPerPage) || filtered.length === 0 ? 'disabled' : ''} class="p-2 rounded hover:bg-gray-200 disabled:opacity-30 transition-colors"><i data-lucide="chevron-right" class="w-5 h-5 text-gray-600"></i></button></div>

                    <div class="flex-1 overflow-auto relative custom-scrollbar">
                        <table class="text-left border-collapse w-max">
                            <thead>

                    else filteredRecs = state.records.filter(r => r.status === '1' || r.status === '2');
                    
                    // Reusing getStatusLabel and calculateDerivedData which are available in scope
                    modalHtml += `<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 animate-fade-in backdrop-blur-sm"><div class="bg-white rounded-xl shadow-2xl w-full max-w-3xl max-h-[80vh] flex flex-col"><div class="p-4 flex justify-between items-center text-white shrink-0 bg-gradient-to-r from-blue-600 to-indigo-600"><h3 class="font-bold flex items-center"><i data-lucide="list" class="w-5 h-5 mr-2"></i> 案件列表</h3><button onclick="window.updateState({modalType: null})" class="hover:bg-white/20 p-1 rounded"><i data-lucide="x" class="w-5 h-5"></i></button></div><div class="p-0 overflow-y-auto flex-1"><table class="w-full text-left border-collapse"><thead class="bg-gray-50 text-gray-500 text-xs uppercase sticky top-0"><tr><th class="p-2">借款人</th><th class="p-2 text-right">欠款</th><th class="p-2 text-center">狀態</th><th class="p-2 text-center">操作</th></tr></thead><tbody class="divide-y divide-gray-100 text-sm">${filteredRecs.map(r => { const calc = calculateDerivedData(r); const status = getStatusLabel(r.status); return `<tr class="hover:bg-gray-50 transition-colors"><td class="p-2 font-bold text-gray-800">${r.borrower} <span class="text-xs font-normal text-gray-400">(${r.displayId})</span></td><td class="p-2 text-right text-red-600 font-mono">${formatNumber(calc.arrears)}</td><td class="p-2 text-center"><span class="px-2 py-1 rounded text-xs ${status.color}">${status.text}</span></td><td class="p-2 text-center"><button onclick="window.updateState({modalType: null}); window.startEdit('${r.id}')" class="text-blue-600 hover:underline text-xs">前往處理</button></td></tr>`; }).join('')}</tbody></table></div></div></div>`;
                }

                app.innerHTML = `
                    <div class="flex h-screen bg-slate-100 font-sans text-gray-800">
                        <div class="w-20 sm:w-64 bg-slate-900 text-white flex flex-col justify-between fixed h-full z-20 transition-all duration-300">
                            <div>
                                <div class="p-6 flex items-center justify-center sm:justify-start border-b border-slate-700">
                                    <i data-lucide="wallet" class="w-8 h-8 text-emerald-400 mr-0 sm:mr-3"></i>
                                    <span class="hidden sm:block text-xl font-bold tracking-wider">借貸管理</span>
                                </div>
                                <div class="px-6 py-4 flex items-center border-b border-slate-800 mb-2">
                                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold mr-3 ${state.isDemoMode ? 'bg-amber-500' : 'bg-slate-700'}">${state.isDemoMode ? 'T' : (state.currentUser ? state.currentUser.substring(0, 2).toUpperCase() : 'U')}</div>
                                    <div class="hidden sm:block">
                                        <p class="text-xs text-slate-400">${state.isDemoMode ? "試用模式" : "已登入"}</p>
                                        <p class="text-sm font-bold text-white truncate w-32">${state.isDemoMode ? "訪客 (不儲存)" : state.currentUser}</p>
                                    </div>
                                </div>
                                <nav class="mt-4 px-4 space-y-2">
                                    <button onclick="window.setActiveTab('dashboard')" class="w-full flex items-center p-3 rounded-lg transition-colors ${state.activeTab === 'dashboard' ? 'bg-emerald-600' : 'hover:bg-slate-800'}"><i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i><span class="hidden sm:block">營運報表</span></button>
                                    <button onclick="window.setActiveTab('list')" class="w-full flex items-center p-3 rounded-lg transition-colors ${state.activeTab === 'list' ? 'bg-emerald-600' : 'hover:bg-slate-800'}"><i data-lucide="database" class="w-5 h-5 mr-3"></i><span class="hidden sm:block">案件列表</span></button>
                                    <button onclick="window.setActiveTab('repayment')" class="w-full flex items-center p-3 rounded-lg transition-colors ${state.activeTab === 'repayment' ? 'bg-emerald-600' : 'hover:bg-slate-800'}"><i data-lucide="banknote" class="w-5 h-5 mr-3"></i><span class="hidden sm:block">還款輸入</span></button>
                                </nav>
                            </div>
                            <div class="p-4 border-t border-slate-700 space-y-2">
                                <button onclick="window.handleLogout()" class="w-full flex items-center justify-center sm:justify-start p-3 rounded-lg text-slate-400 hover:bg-red-900/30 hover:text-red-400 transition-colors">
                                    <i data-lucide="log-out" class="w-5 h-5 mr-0 sm:mr-2"></i>
                                    <span class="hidden sm:block font-medium">登出系統</span>
                                </button>
                            </div>
                        </div>
                        <div class="flex-1 ml-20 sm:ml-64 p-4 sm:p-8 overflow-x-hidden">
                            ${content}
                        </div>
                        ${modalHtml}
                    </div>
                `;
            }
            lucide.createIcons();
        };

        // Init App (Start with checking state)
        if (firebaseAvailable) {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    state.currentUser = user.email || user.uid;
                    state.isDemoMode = false;
                } else {
                    state.currentUser = null;
                }
                renderApp();
            });
        } else {
            // Force render immediately in demo mode
            renderApp();
        }

    </script>
</body>
</html>
