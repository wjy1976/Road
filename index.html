        const TAIWAN_CITIES = [

        const generateOrderId = () => {

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hour = String(now.getHours()).padStart(2, '0');
            const minute = String(now.getMinutes()).padStart(2, '0');
            const second = String(now.getSeconds()).padStart(2, '0');
            return `ORD-${year}${month}${day}-${hour}${minute}${second}`;

        const showToast = (msg, type = 'success') => {
            const container = document.getElementById('message-container');
            const el = document.createElement('div');

            container.appendChild(el); lucide.createIcons(); setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2500);

            if (category === 'machine') return '台';

        };

            if (!LINE_API_URL) return;
            try {
                await fetch(LINE_API_URL, {
                    method: 'POST',
                    mode: 'no-cors',

            } catch (error) {

        };

        // --- Partial Refresh & Search Logic ---
        window.handleOrderSearch = (val) => {
            state.orderSearch = val;
            window.refreshOrderListUI();
        };

        window.refreshOrderListUI = () => {
            const tbody = document.getElementById('orderListBody');
            if (tbody) {
                tbody.innerHTML = window.generateOrderRows();
                lucide.createIcons();
            }
        };

        window.generateOrderRows = () => {
            const isAdmin = state.currentUser.role === 'admin';
            const isSupplier = state.currentUser.role === 'supplier';
            
            let orders = [];
            if (isAdmin) {
                orders = state.orders;
            } else if (isSupplier) {
                orders = state.orders.filter(o => o.items.some(i => (i.supplierName || '自有') === state.currentUser.name));
            } else {
                orders = state.orders.filter(o => o.clientId === state.currentUser.username);
            }
            
            if ((isAdmin || isSupplier) && state.orderFilter !== 'all') {
                if(state.orderFilter === 'pending') orders = orders.filter(o => o.status === 'pending');
                else if(state.orderFilter === 'unpaid') orders = orders.filter(o => o.paymentStatus === 'unpaid');
            }
            
            if (state.orderSearch) {
                const term = state.orderSearch.toLowerCase();
                orders = orders.filter(o => o.id.toLowerCase().includes(term) || o.clientName.toLowerCase().includes(term) || o.items.some(i => i.name.toLowerCase().includes(term) || (i.category && CAT_MAP[i.category] && CAT_MAP[i.category].includes(term)) || (i.supplierName && i.supplierName.toLowerCase().includes(term))));
            }

            if (orders.length === 0) return `<tr><td colspan="${isAdmin ? 11 : ((isAdmin || isSupplier) ? 10 : 8)}" class="p-8 text-center text-slate-400">沒有符合的訂單</td></tr>`;
            // (原邏輯: admin 11 (多一欄 客戶紙軸), supplier 10, client 8)

            return orders.map(o => {
                const firstItem = o.items[0];
                const product = state.products.find(p => p.id === firstItem.productId.replace('_printed',''));
                const category = firstItem.category ? CAT_MAP[firstItem.category] : (product ? CAT_MAP[product.category] : '-');
                // 只顯示型號 (product.name 或 firstItem.name), 規格不再顯示在管理員/供應商訂單管理
                const spec = product ? product.name : (firstItem.name || firstItem.spec || '-');
                // 訂單的所有供應商 (可能有多個)
                const orderSuppliers = [...new Set(o.items.map(i => i.supplierName || '自有'))].join(', ');
                const isPending = o.status === 'pending';
                // 供應商只看到自己的項目 (成本), 看不到管理員給客戶的售價

                let displayTotal = o.totalAmount;
                let displayCost = 0; // 管理員看的「總出貨成本」
                if (isSupplier) {
                    displayItems = o.items.filter(i => (i.supplierName || '自有') === state.currentUser.name);
                    // 算供應商自己那部分的成本 (從 products 拿, 印刷版用 costPrinted, 紙類要乘 rollsPerBox)
                    displayTotal = displayItems.reduce((sum, i) => {
                        // 袋子類別: 直接用 item.cost
                        if (i.category === 'medicine_bag') {
                            return sum + (parseFloat(i.cost) || 0) * (i.qty || 0);
                        }
                        const prod = state.products.find(p => p.id === (i.productId || '').replace('_printed',''));
                        const isPaperItem = i.category === 'paper';
                        const rpb = (prod && prod.rollsPerBox > 0) ? prod.rollsPerBox : 1;
                        const mult = isPaperItem ? rpb : 1;
                        const perUnit = (i.hasPrinting && prod?.costPrinted > 0) ? parseFloat(prod.costPrinted) : (parseFloat(prod?.cost) || parseFloat(i.cost) || 0);
                        return sum + perUnit * mult * (i.qty || 0);
                    }, 0);
                } else if (isAdmin) {
                    // 管理員: 算所有供應商的總成本 (不管誰出的)
                    displayCost = o.items.reduce((sum, i) => {
                        // 袋子類別: 直接用 item.cost (因為 productId 是合成的, 找不到對應 product)
                        if (i.category === 'medicine_bag') {
                            return sum + (parseFloat(i.cost) || 0) * (i.qty || 0);
                        }
                        const prod = state.products.find(p => p.id === (i.productId || '').replace('_printed',''));
                        const isPaperItem = i.category === 'paper';
                        const rpb = (prod && prod.rollsPerBox > 0) ? prod.rollsPerBox : 1;
                        const mult = isPaperItem ? rpb : 1;
                        const perUnit = (i.hasPrinting && prod?.costPrinted > 0) ? parseFloat(prod.costPrinted) : (parseFloat(prod?.cost) || parseFloat(i.cost) || 0);
                        return sum + perUnit * mult * (i.qty || 0);
                    }, 0);
                }
                let paperNote = '';
                let paperPhotoHtml = '';

                // - 管理員: 只要訂單裡有任何紙軸 (不管誰出的), 都看得到
                // - 供應商: 只能看到「自己出的紙軸」對應的客戶紙軸規格
                const itemsToCheck = isSupplier ? displayItems : o.items;
                const hasPaperItem = itemsToCheck.some(i => i.category === 'paper');
                let paperPhotoUrl = '';
                if (hasPaperItem && (isAdmin || isSupplier)) {

                console.log('[v106 防抖] renderApp 已在排隊, 跳過 (' + source + ')');
                return;
            }
            _renderDebounce = setTimeout(() => {
                _renderDebounce = null;
                console.log('[v106 防抖] 執行 renderApp (來源: ' + source + ')');
                renderApp();
            }, 100);
        };

        const initDataListeners = () => {
            const collections = ['users', 'products', 'orders', 'expenses', 'repairs', 'announcements', 'messages'];
            collections.forEach(col => {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', col), (snap) => {
                    const data = snap.docs.map(d => {
                        const docData = d.data();
                        return { ...docData, id: docData.id || d.id, docId: d.id };

                    if(col==='orders') {
                        state.orders = data.sort((a,b)=>new Date(b.date)-new Date(a.date));

                        console.log('[v106] orders 更新 (' + data.length + ' 筆)');

                    else if(col==='repairs') state.repairs = data.sort((a,b)=>b.createdAt - a.createdAt);
                    else if(col==='expenses') state.expenses = data.sort((a,b)=>new Date(b.date)-new Date(a.date));
                    else if(col==='products') state.products = data;
                    else if(col==='announcements') state.announcements = data;
                    else if(col==='messages') {
                        const wasChanged = JSON.stringify((state.messages||[]).map(m=>m.id)) !== JSON.stringify(data.map(m=>m.id));
                        state.messages = data;
                        if (wasChanged) console.log('[v106] messages 更新 (' + data.length + ' 筆)');
                    }
                    else if(col==='users') {
                        // v106: 過濾掉 lastSeen, id, docId 這三個自然變動欄位
                        const stripForCompare = u => {
                            const r = {};
                            Object.keys(u).forEach(k => {
                                if (k !== 'lastSeen' && k !== 'id' && k !== 'docId') r[k] = u[k];
                            });
                            return JSON.stringify(r);
                        };
                        const oldSig = (state.users || []).map(stripForCompare).sort().join('|');
                        const newSig = data.map(stripForCompare).sort().join('|');
                        const isInitialLoad = !state.users || state.users.length === 0;
                        const dataChanged = oldSig !== newSig;
                        state.users = data;
                        state.isLoading = false;
                        if(state.currentUser) {
                            const fresh = data.find(u=>u.username===state.currentUser.username);
                            if (fresh) {
                                state.currentUser.lastSeen = fresh.lastSeen;
                            }
                        }
                        if (state.activeHistoryClient && state.showHistoryModal) {
                            state.activeHistoryClient = data.find(u => u.docId === state.activeHistoryClient.docId) || state.activeHistoryClient;
                        }
                        window.refreshCRMListUI();
                        if (!state.currentUser || state.currentView === 'login') {
                            return;
                        }
                        // v106: 純 lastSeen 更新絕對不重畫
                        if (!dataChanged && !isInitialLoad) {
                            console.log('[v106] users 純 lastSeen 更新, 跳過 renderApp');
                            return;
                        }
                        if (isInitialLoad) {
                            console.log('[v106] users 初次載入');
                            _debouncedRender('users-initial');
                            return;
                        }
                        console.log('[v106] users 真的變了, render');
                        _debouncedRender('users-changed');
                        return;
                    }
                    // 其他 collection 載入
                    if (!state.currentUser || state.currentView === 'login') return;
                    const focused = document.activeElement;
                    if (!focused || (focused.tagName !== 'INPUT' && focused.tagName !== 'TEXTAREA')) {
                        _debouncedRender(col);
                    }
                }, err => { console.error(err); state.isLoading = false; renderApp(); });
            });
        };

        if (isConfigured) {
            const initAuthFlow = async () => {
                try {
                    if (LOCAL_FIREBASE_CONFIG.apiKey) await signInAnonymously(auth);
                    else if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                    else await signInAnonymously(auth);
                } catch (e) { console.error("Auth", e); }
            };
            initAuthFlow();
            onAuthStateChanged(auth, u => { if(u) initDataListeners(); });
            // v106: 頁面載入時, 自動清掉舊的 dismissed 標記 (給用戶重試機會)
            if (window.clearAllBiometricDismissed) window.clearAllBiometricDismissed();
            // v106: 頁面載入時, 自動嘗試生物辨識
            setTimeout(() => { if (window.autoTryBiometric) window.autoTryBiometric(); }, 2500);
        }

        // --- v106 生物辨識登入 (WebAuthn) ---
        // 用手機內建的 Face ID / Touch ID / 指紋, 不存任何生物資料
        const _bioBufferToBase64URL = buffer => {
            const bytes = new Uint8Array(buffer);
            let str = '';
            for (let i = 0; i < bytes.length; i++) str += String.fromCharCode(bytes[i]);
            return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
        };
        const _bioBase64URLToBuffer = base64URL => {
            const base64 = base64URL.replace(/-/g, '+').replace(/_/g, '/');
            const padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
            const binary = atob(padded);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes.buffer;
        };
        const _isWebAuthnSupported = () => {
            return window.PublicKeyCredential &&
                   typeof navigator.credentials?.create === 'function' &&
                   typeof navigator.credentials?.get === 'function';
        };
        // v106: 更精確的偵測 (檢查裝置是否有「平台生物辨識器」)
        const _isUVPlatformAvailable = async () => {
            if (!_isWebAuthnSupported()) return false;
            try {
                if (typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable === 'function') {
                    return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
                }
                return true;  // 沒 API 就假設可用 (讓瀏覽器自己判斷)
            } catch (e) {
                console.warn('[v106 生物辨識] 偵測失敗:', e);
                return true;
            }
        };

        // v106: 偵測是否在 LINE/IG/FB 內建瀏覽器 (這些不支援完整 WebAuthn)
        const _isInAppBrowser = () => {
            const ua = navigator.userAgent.toLowerCase();
            if (ua.includes('line/')) return 'LINE';
            if (ua.includes('fban') || ua.includes('fbav')) return 'Facebook';
            if (ua.includes('instagram')) return 'Instagram';
            if (ua.includes('micromessenger')) return 'WeChat';
            return null;
        };
        // 註冊生物辨識 (首次設定)
        window.registerBiometric = async (username) => {
            if (!_isWebAuthnSupported()) {
                return { success: false, error: '此裝置或瀏覽器不支援生物辨識' };
            }
            // v106: 偵測內建瀏覽器 (LINE/FB/IG), 這些不支援 WebAuthn
            const inApp = _isInAppBrowser();
            if (inApp) {
                return { success: false, error: '請用 Safari 開啟此網址 (不要用 ' + inApp + ' 內建瀏覽器)' };
            }
            // v106: 不預檢查, 直接嘗試
            const uvCheck = await _isUVPlatformAvailable();
            console.log('[v106 生物辨識] 平台偵測 (僅參考):', uvCheck);
            console.log('[v106 生物辨識] 開始註冊:', username);
            try {
                // v106: 用 crypto.getRandomValues 確保 challenge 是隨機的
                const challenge = new Uint8Array(32);
                crypto.getRandomValues(challenge);
                const userId = new TextEncoder().encode(username);
                const credential = await navigator.credentials.create({
                    publicKey: {
                        challenge,
                        rp: { name: '羅德精技' },
                        user: { id: userId, name: username, displayName: username },
                        pubKeyCredParams: [
                            { alg: -7, type: 'public-key' },
                            { alg: -257, type: 'public-key' }
                        ],
                        // v106: 拿掉 residentKey, iOS Safari 14 相容性較好
                        authenticatorSelection: {
                            authenticatorAttachment: 'platform',
                            userVerification: 'required'
                        },
                        timeout: 60000,
                        attestation: 'none'
                    }
                });
                if (!credential) return { success: false, error: '註冊失敗' };
                if (!credential.rawId) return { success: false, error: '註冊失敗 (無憑證 ID)' };
                const credentialData = {
                    credentialId: _bioBufferToBase64URL(credential.rawId),
                    createdAt: new Date().toISOString()
                };
                // v106: 註冊成功後, 順便清掉 dismissed 標記 (重新給機會)
                try { localStorage.removeItem(`biometric_dismissed_${username}`); } catch(e) {}
                localStorage.setItem(`biometric_${username}`, JSON.stringify(credentialData));
                console.log('[v106 生物辨識] 註冊成功:', username, credentialData);
                return { success: true };
            } catch (e) {
                console.error('[v106 生物辨識] 註冊失敗:', e.name, e.message);
                if (e.name === 'NotAllowedError') return { success: false, error: '已取消設定' };
                if (e.name === 'SecurityError') return { success: false, error: '請用 HTTPS 開啟 (非 file://)' };
                if (e.name === 'NotSupportedError') return { success: false, error: '此裝置不支援生物辨識' };
                if (e.name === 'InvalidStateError') return { success: false, error: '此裝置已註冊, 請稍候' };
                return { success: false, error: '註冊失敗: ' + (e.message || e.name || '未知錯誤') };
            }
        };
        // 生物辨識登入
        window.loginWithBiometric = async (username) => {
            if (!_isWebAuthnSupported()) return { success: false, error: '此裝置不支援生物辨識' };
            const stored = localStorage.getItem(`biometric_${username}`);
            if (!stored) {
                console.warn('[v106 生物辨識] 找不到註冊資料:', `biometric_${username}`);
                return { success: false, error: '此帳號尚未註冊生物辨識' };
            }
            let credData;
            try { credData = JSON.parse(stored); } catch(e) {
                console.error('[v106 生物辨識] 解析失敗:', e);
                return { success: false, error: '資料損毀, 請重新註冊' };
            }
            if (!credData.credentialId) {
                console.error('[v106 生物辨識] 沒有 credentialId:', credData);
                return { success: false, error: '註冊資料異常, 請重新註冊' };
            }
            console.log('[v106 生物辨識] 開始驗證:', username);
            try {
                const challenge = new Uint8Array(32);
                crypto.getRandomValues(challenge);
                const credential = await navigator.credentials.get({
                    publicKey: {
                        challenge,
                        // v106: iOS Safari 不支援 transports: ['internal'], 拿掉
                        allowCredentials: [{
                            id: _bioBase64URLToBuffer(credData.credentialId),
                            type: 'public-key'
                        }],
                        userVerification: 'required',
                        timeout: 60000
                    }
                });
                if (!credential) return { success: false, error: '驗證失敗' };
                return { success: true, username };
            } catch (e) {
                if (e.name === 'NotAllowedError') return { success: false, error: '已取消' };
                return { success: false, error: e.message || '驗證失敗' };
            }
        };
        // 取得本機所有已註冊的帳號
        window.getRegisteredBiometricUsers = () => {
            const users = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                // v106 修正: 排除 dismissed_* 和 lastAutoTry 這些非用戶 key
                if (key && key.startsWith('biometric_') &&
                    !key.startsWith('biometric_dismissed_') &&
                    !key.startsWith('biometric_lastAutoTry')) {
                    const username = key.replace('biometric_', '');
                    try {
                        const raw = localStorage.getItem(key);
                        const data = JSON.parse(raw);
                        // 確保有 credentialId 才算有效註冊
                        if (data && data.credentialId) {
                            users.push({ username, ...data });
                        }
                    } catch (e) {
                        console.warn('[v106 生物辨識] 解析失敗:', key, e);
                    }
                }
            }
            return users;
        };
        // 刪除生物辨識
        window.removeBiometric = (username) => {
            localStorage.removeItem(`biometric_${username}`);
        };
        // 檢查某帳號是否已註冊
        window.isBiometricRegistered = (username) => {
            return !!localStorage.getItem(`biometric_${username}`);
        };
        // 完成生物辨識登入 (繞過密碼)
        window.completeBiometricLogin = async (username) => {
            const u = state.users.find(x => x.username === username || x.phone === username);
            if (!u) return { success: false, error: '查無此帳號' };
            const isStaffOrSupplier = u.role === 'admin' || u.role === 'supplier' || u.type === 'supplier';
            if (state.loginMode === 'client' && isStaffOrSupplier) return { success: false, error: '請由內部/供應商入口登入' };
            if (state.loginMode === 'staff' && !isStaffOrSupplier) return { success: false, error: '請由醫師/藥師入口登入' };
            state.currentUser = u;
            state.loginMode = 'select';
            state.currentView = 'welcome';
            try { localStorage.setItem('lastLoggedInUser', u.username); } catch (e) {}
            showToast(`✓ 歡迎回來 ${u.name}`, 'success', 500);
            setTimeout(() => { if (window.updateLastSeen) window.updateLastSeen(); }, 1000);
            setInterval(() => { if (window.updateLastSeen) window.updateLastSeen(); }, 60000);
            renderApp();
            return { success: true };
        };

        // --- Auth Logic ---
        window.setLoginMode = m => { state.loginMode = m; renderApp(); };
        // v106: 處理生物辨識登入按鈕
        window.handleBiometricLogin = async (username) => {
            if (!_isWebAuthnSupported()) return showToast('此裝置不支援生物辨識', 'error');
            if (state.users.length === 0) {
                const start = Date.now();
                while (state.users.length === 0 && (Date.now() - start) < 8000) {
                    await new Promise(r => setTimeout(r, 150));
                }
                if (state.users.length === 0) return showToast('系統尚未準備好, 請稍候', 'error');
            }
            showToast('請用生物辨識驗證...', 'info', 2000);
            const result = await window.loginWithBiometric(username);
            if (!result.success) {
                if (result.error && !result.error.includes('取消')) {
                    showToast(result.error, 'error', 3000);
                }
                return;
            }
            const loginResult = await window.completeBiometricLogin(username);
            if (!loginResult.success) {
                showToast(loginResult.error, 'error', 3000);
            }
        };

        window.handleLogin = async e => {
            e.preventDefault();
            if(!isConfigured) return alert("請設定 Firebase");
            // 資料未載入時靜默等待 (不彈任何提醒, 不阻塞 UI)
            if (state.users.length === 0) {
                const start = Date.now();
                while (state.users.length === 0 && (Date.now() - start) < 8000) {
                    await new Promise(r => setTimeout(r, 150));
                }
                if (state.users.length === 0) return showToast('登入失敗, 請重整頁面', 'error');
            }

            const f = e.target;
            const inputUser = f.username.value.trim();
            const inputPass = f.password.value.trim();
            // 先找帳號 (不分密碼)
            let u = state.users.find(x => x.username === inputUser || x.phone === inputUser);

            if(!u) return showToast('查無此帳號', 'error');

            // 重新查最新 user 資料 (避免用舊 role/type 登入, 特別是管理員改過權限)
            if (u.docId) {
                try {
                    const freshSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', u.docId));
                    if (freshSnap.exists()) {
                        const freshData = { ...freshSnap.data(), id: freshSnap.data().id || freshSnap.id, docId: freshSnap.id };
                        // 如果 role / type / name 有差, 更新快取並用新資料
                        if (freshData.role !== u.role || freshData.type !== u.type || freshData.name !== u.name) {
                            const idx = state.users.findIndex(x => x.docId === u.docId);
                            if (idx >= 0) state.users[idx] = { ...state.users[idx], ...freshData };
                            u = { ...u, ...freshData };
                        }
                    } else {
                        return showToast('此帳號已停用, 請聯絡管理員', 'error');
                    }
                } catch (e) {
                    console.warn('[登入] 查最新資料失敗, 用 cache:', e.message);
                }
            }

            // 修正：增加對 type 的判斷，防止因為權限切換導致 role 變成 client 而無法從廠商入口登入
            const isStaffOrSupplier = u.role === 'admin' || u.role === 'supplier' || u.type === 'supplier';

            if(state.loginMode === 'client' && isStaffOrSupplier) return showToast('請由內部/供應商入口登入', 'error');
            if(state.loginMode === 'staff' && !isStaffOrSupplier) return showToast('請由醫師/藥師入口登入', 'error');

            // 路徑 A: 帳號有 Firebase Auth 紀錄 (被 v5.9 升級過, 密碼欄位已被刪除) → 用 Firebase Auth 驗證
            if (u.email && u.authUid) {
                try {
                    await signInWithEmailAndPassword(auth, u.email, inputPass);
                    showToast(`歡迎回來 ${u.name}`);
                    state.currentUser = u; state.loginMode = 'select';
                    state.currentView = 'welcome';
                    try { localStorage.setItem('lastLoggedInUser', u.username); } catch (e) {}
                    renderApp();
                    // v106: 登入後更新 lastSeen, 啟動定期更新
                    setTimeout(() => { if (window.updateLastSeen) window.updateLastSeen(); }, 1000);
                    setInterval(() => { if (window.updateLastSeen) window.updateLastSeen(); }, 60000); // 每分鐘更新
                    // v106: 詢問是否啟用生物辨識
                    setTimeout(() => window.maybePromptBiometric(u.username), 1500);
                    try { localStorage.removeItem(`biometric_dismissed_${u.username}`); } catch(e) {}  // v106: 清掉舊 dismiss, 讓用戶重新看到提示
                    return;
                } catch (err) {
                    console.warn('[登入] Firebase Auth 失敗, 嘗試明文密碼比對', err);
                    // 繼續往下走明文比對
                }
            }

            // 路徑 B: 傳統明文密碼比對
            if (u.password && u.password === inputPass) {
                state.currentUser = u; state.loginMode = 'select';
                state.currentView = 'welcome';
                try { localStorage.setItem('lastLoggedInUser', u.username); } catch (e) {}
                showToast(`✓ 歡迎回來 ${u.name}`, 'success', 500);
                // v106: 登入後更新 lastSeen, 啟動定期更新
                setTimeout(() => { if (window.updateLastSeen) window.updateLastSeen(); }, 1000);
                setInterval(() => { if (window.updateLastSeen) window.updateLastSeen(); }, 60000); // 每分鐘更新
                // v106: 詢問是否啟用生物辨識
                setTimeout(() => window.maybePromptBiometric(u.username), 1500);
                try { localStorage.removeItem(`biometric_dismissed_${u.username}`); } catch(e) {}  // v106: 清掉舊 dismiss

                setTimeout(() => {

                        if (!u.uid && !u.authUid) {
                            updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', u.docId), { uid: auth.currentUser.uid, authUid: auth.currentUser.uid, email: auth.currentUser.email }).catch(() => {});
                        }
                    }
                    renderApp();
                }, 100);

        };

        // v106: 詢問是否啟用生物辨識 (首次登入後, 用浮動按鈕)
        window.maybePromptBiometric = async (username) => {

                return;

            if (window.isBiometricRegistered(username)) {

        // v106: 顯示「啟用生物辨識」浮動提示
        window.showBiometricPrompt = (username) => {

            div.className = 'fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white rounded-2xl shadow-2xl p-4 max-w-sm w-[90%] animate-fade-in';

                <div class="flex items-start gap-3">
                    <div class="text-3xl shrink-0">👤</div>

                </div>

                    <button id="bio-prompt-yes" class="flex-1 py-2 bg-blue-500 hover:bg-blue-600 rounded-lg text-xs font-bold">立即啟用</button>

        // 圖片壓縮 (800px / JPEG 0.7)
        window.compressImage = (file, maxWidth = 800, quality = 0.7) => {
            return new Promise((resolve, reject) => {
                if (!file.type.startsWith('image/')) {
                    const r = new FileReader();
                    r.onload = (e) => resolve({ data: e.target.result, fileName: file.name, type: file.type, isImage: false });
                    r.onerror = reject;
                    r.readAsDataURL(file);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w > maxWidth) { h = Math.round((maxWidth / w) * h); w = maxWidth; }
                        const canvas = document.createElement('canvas');
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const data = canvas.toDataURL('image/jpeg', quality);
                        resolve({ data, fileName: file.name, type: 'image/jpeg', isImage: true });
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;

        function renderOrderEditModal() { 
            if (!state.showOrderEditModal || !state.activeEditingOrder) return ''; 
            const o = state.activeEditingOrder; 
            const isPending = o.status === 'pending';
            const isAdmin = state.currentUser.role === 'admin';
            const isSupplier = state.currentUser.role === 'supplier';
            
            // 抓取客戶地址 (供老闆/廠商看)
            const clientUser = state.users.find(u => u.username === o.clientId);
            const address = clientUser ? clientUser.address : '未提供';

            return `<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-sm px-4"><div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden animate-fade-in max-h-[90vh] overflow-y-auto custom-scrollbar mobile-modal"><div class="p-5 border-b bg-gray-50 flex justify-between items-center sticky top-0 z-10"><h3 class="font-bold text-lg text-slate-800">訂單內容 (${o.id})</h3><button onclick="window.closeOrderEditModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-6 h-6"></i></button></div><div class="p-6">
            <div class="mb-4 text-sm text-slate-600 bg-slate-50 p-4 rounded-lg border border-slate-200">
                <div class="flex justify-between items-center mb-2"><div><span class="font-bold mr-2 text-slate-700">客戶:</span><span class="text-blue-700 font-bold">${o.clientName}</span></div>${!isPending ? '<span class="text-red-500 font-bold bg-red-50 px-2 py-1 rounded text-xs border border-red-100">訂單已鎖定</span>' : ''}</div>
                <div class="flex items-center gap-2 mb-2">
                    <span class="font-bold text-slate-700">日期:</span>
                    <input type="date" value="${o.date}" onchange="window.updateOrderDetails(event, 'date')" class="border p-1 rounded text-sm outline-none focus:border-blue-500 ${!isAdmin ? 'bg-gray-100 text-gray-500 cursor-not-allowed border-transparent' : ''}" ${!isPending || !isAdmin ? 'disabled' : ''}>
                </div>
                ${(isAdmin || isSupplier) ? `<div class="mb-2"><span class="font-bold mr-2 text-slate-700">出貨地址:</span>${address}</div><div class="mt-2 pt-2 border-t border-slate-200"><span class="font-bold mr-2 text-slate-700">客戶備註留言:</span><span class="text-orange-600 font-bold">${o.orderNote || '無'}</span></div>` : ''}
            </div>
            <div class="space-y-3">${o.items.map((item, idx) => {
                const unit = getUnitLabel(item.category);
                const rawId = item.productId.split('_')[0];
                const product = state.products.find(p => p.id === rawId);
                const rollsPerBox = (product && product.rollsPerBox > 0) ? product.rollsPerBox : 1;
                const isPaper = item.category === 'paper';
                const totalRolls = isPaper ? (item.qty * rollsPerBox) : 0;
                // 供應商視角: 用產品成本 (不是客戶售價)
                // 紙類產品: 成本是「每卷」, 訂單數量是「每箱」, 要乘上 rollsPerBox
                const perUnitCost = (item.hasPrinting && product?.costPrinted > 0) ? parseFloat(product.costPrinted) : (parseFloat(product?.cost) || 0);
                const rollMult = isPaper && rollsPerBox > 0 ? rollsPerBox : 1;
                const supplierCost = perUnitCost * rollMult; // 換算成「每箱」成本
                const supplierLineTotal = supplierCost * (item.qty || 0);
                const priceLabel = isSupplier ? '單價' : '單價';
                // 供應商視角顯示: 單箱金額 (紙) / 單價 (袋), 共 N 箱/個, 小計
                let supplierDetail = '';
                if (isSupplier) {

        function renderProfitDetails() {
            const currentYear = new Date().getFullYear().toString();
            let content = '', title = '';

                title = `${currentYear} 年度利潤明細 (已完結)`;
                const yearOrders = state.orders.filter(o => o.date.startsWith(currentYear) && o.status === 'completed' && o.paymentStatus === 'paid');
                content = `<table class="w-full text-left text-sm"><thead class="bg-slate-50"><tr><th class="p-4">日期</th><th class="p-4">訂單號</th><th class="p-4">客戶</th><th class="p-4">產品資訊</th><th class="p-4 text-right">營收</th><th class="p-4 text-right">成本(估)</th><th class="p-4 text-right font-bold text-emerald-600">利潤</th></tr></thead><tbody>${yearOrders.map(o => { const cost = o.items.reduce((sum, i) => sum + (i.cost||0)*i.qty, 0); const profit = o.totalAmount - cost; const firstItem = o.items[0] || {}; const catName = CAT_MAP[firstItem.category] || firstItem.category || '-'; const prodInfo = `<div class="text-xs"><span class="font-bold text-slate-700">${firstItem.name}</span><div class="text-slate-500"><span class="bg-slate-100 px-1 rounded">${catName}</span><span class="ml-1">${firstItem.supplierName || '自有'}</span>${firstItem.spec ? `<span class="ml-1 text-slate-400">(${firstItem.spec})</span>` : ''}</div>${o.items.length > 1 ? `<span class="text-[10px] text-slate-400 mt-1 block">...等共 ${o.items.length} 項商品</span>` : ''}</div>`; return `<tr class="border-b border-slate-50 hover:bg-slate-50"><td class="p-4 text-slate-500">${o.date}</td><td class="p-4 font-mono text-xs">${o.id}</td><td class="p-4 font-medium">${o.clientName}</td><td class="p-4">${prodInfo}</td><td class="p-4 text-right">${formatMoney(o.totalAmount)}</td><td class="p-4 text-right text-slate-400">${formatMoney(cost)}</td><td class="p-4 text-right font-bold text-emerald-600">${formatMoney(profit)}</td></tr>`; }).join('')}</tbody></table>`;
            } else if (state.dashboardView === 'profit_all') {

                content = `<table class="w-full text-left text-sm"><thead class="bg-slate-50"><tr><th class="p-4">年度</th><th class="p-4 text-right">總營收</th><th class="p-4 text-right">總成本</th><th class="p-4 text-right font-bold text-emerald-600">總利潤</th></tr></thead><tbody>${sortedYears.map(y => `<tr class="border-b border-slate-50 hover:bg-slate-50"><td class="p-4 font-bold text-lg">${y}</td><td class="p-4 text-right">${formatMoney(years[y].revenue)}</td><td class="p-4 text-right text-slate-400">${formatMoney(years[y].cost)}</td><td class="p-4 text-right font-bold text-emerald-600 text-lg">${formatMoney(years[y].profit)}</td></tr>`).join('')}</tbody></table>`;

 class="w-full border p-2 rounded"><label class="block text-sm mt-2 flex items-center"><input type="checkbox" name="hasPrinting" class="mr-2" ${p.hasPrinting?'checked':''} onchange="document.getElementById('printOptions').style.display=this.checked?'block':'none'"> 提供印刷選項?</label></div><div id="printOptions" class="bg-blue-50 p-3 rounded border border-blue-100" style="display:${p.hasPrinting?'block':'none'}"><h4 class="text-xs font-bold text-blue-800 mb-2">印刷版設定</h4><div class="grid grid-cols-2 gap-2"><div><label class="text-xs">印刷成本</label><input name="costPrinted" type="number" step="0.01" value="${p.costPrinted||0}" class="w-full border p-1 rounded text-sm"></div><div><label class="text-xs">印刷售價</label><input name="pricePrinted" type="number" step="0.01" value="${p.pricePrinted||0}" class="w-full border p-1 rounded text-sm"></div><div><label class="text-xs">印刷MOQ</label><input name="moqPrinted" type="number" value="${p.moqPrinted||100}" class="w-full border p-1 rounded text-sm"></div></div></div></div>

bel><input name="price" type="number" step="0.01" value="${p.price||''}" oninput="window.calculatePrice('preTax')" ${priceReadOnly} class="w-full border p-1"></div><div><label class="block text-xs">稅後售價</label><input name="priceAfterTax" type="number" step="0.01" value="${p.priceAfterTax||''}" oninput="window.calculatePrice('postTax')" required class="w-full border p-1 font-bold"></div>`}</div><div id="boxPricePreview"></div></div><div class="grid grid-cols-2 gap-4" id="stockField"><div><label class="block text-sm">庫存</label><input name="stock" type="number" value="${p.stock||0}" required class="w-full border p-2 rounded"></div><div><label class="block text-sm">安全庫存</label><input name="safeStock" type="number" value="${p.safeStock||5}" required class="w-full border p-2 rounded"></div></div><button class="w-full bg-blue-600 text-white p-2 rounded font-bold">儲存</button></form></div></div>`;

        // ============ 通知鈴鐺 (admin/supplier/client) ============
        function getNotificationItems() {
            const role = state.currentUser?.role;
            const items = [];
            if (role === 'admin') {
                const pending = (state.products || []).filter(p =>
                    p.category !== 'parts' && (p.approved !== true || p.listed !== true)
                );
                pending.slice(0, 3).forEach(p => {
                    items.push({
                        type: 'pending_product',
                        title: '📦 待審核',
                        subtitle: `${p.supplierName || '供應商'} - ${p.name}`,
                        icon: 'package', color: 'bg-amber-50 text-amber-500',
                        action: () => {
                            window.goToPendingProducts();
                            window.closeNotificationPanel();
                        }
                    });
                });
                // 管理員未讀訊息
                const unread = (state.messages || []).filter(m => m.fromRole !== 'admin' && !m.read);
                unread.slice(0, 3).forEach(m => {
                    items.push({
                        type: 'message',
                        title: `💬 ${m.fromName || '客戶'}`,
                        subtitle: m.content.slice(0, 40) + (m.content.length > 40 ? '...' : ''),
                        icon: 'message-square', color: 'bg-blue-50 text-blue-500',
                        action: () => { window.setView('messages'); window.closeNotificationPanel(); }
                    });
                });
            } else if (role === 'supplier') {
                // 供應商未讀訊息 (只顯示管理員回覆, 訂單/叫修只在 Telegram 通知)
                const unread = (state.messages || []).filter(m =>
                    m.fromRole === 'admin' && !m.read &&
                    m.type !== 'order_alert' && m.type !== 'repair_alert'
                );
                unread.slice(0, 3).forEach(m => {
                    const isOrder = m.type === 'order_alert';
                    const isRepair = m.type === 'repair_alert';
                    items.push({
                        type: m.type || 'message',
                        title: isOrder ? '🛒 新訂單' : (isRepair ? '🔧 新叫修' : '💬 管理員回覆'),
                        subtitle: m.content.slice(0, 40) + (m.content.length > 40 ? '...' : ''),
                        icon: isOrder ? 'shopping-cart' : (isRepair ? 'wrench' : 'message-square'),
                        color: isOrder ? 'bg-blue-50 text-blue-500' : (isRepair ? 'bg-orange-50 text-orange-500' : 'bg-blue-50 text-blue-500'),
                        action: () => {
                            if (isOrder) window.setView('orders');
                            else if (isRepair) window.setView('repairs_supplier');
                            else window.setView('messages');
                            window.closeNotificationPanel();
                        }
                    });
                });
            } else if (role === 'client') {
                // 客戶未讀訊息 (只顯示管理員回覆, 排除系統通知)
                const unread = (state.messages || []).filter(m =>
                    m.fromRole === 'admin' && !m.read &&
                    m.type !== 'order_alert' && m.type !== 'repair_alert'
                );
                unread.slice(0, 3).forEach(m => {
                    items.push({
                        type: 'message',
                        title: '💬 管理員回覆',
                        subtitle: m.content.slice(0, 40) + (m.content.length > 40 ? '...' : ''),
                        icon: 'message-square', color: 'bg-blue-50 text-blue-500',
                        action: () => { window.setView('contact'); window.closeNotificationPanel(); }
                    });
                });
            }
            return items;
        }

        // ============ 留言板 ============
        function renderMessages() {
            const role = state.currentUser?.role;
            // 進入留言板 → 自動標記已讀
            setTimeout(() => window.autoMarkMessagesRead(), 100);
            // 客戶/供應商 → 簡單客服對話框 (跟管理員對話)
            if (role !== 'admin') {
                return renderMessagesSimple();
            }
            // 管理員 → 對話清單 + 對話視窗
            return renderMessagesAdmin();
        }

        // ============ v106 新版: 簡單對話框 (客戶/供應商用) ============
        function renderMessagesSimple() {
            const role = state.currentUser?.role;
            const myUid = state.currentUser?.uid;
            const myName = state.currentUser?.name;
            // 只取跟管理員的對話
            const messages = (state.messages || []).filter(m => {
                if (m.type === 'order_alert' || m.type === 'repair_alert' || m.type === 'product_alert') return false;
                const isFromMe = (m.fromUserId && m.fromUserId === myUid) || m.fromName === myName;
                const adminUser = (state.users || []).find(u => u.role === 'admin');
                const adminId = adminUser?.uid || adminUser?.name || '47actw';
                const isToMe = (m.toUserId && (m.toUserId === myUid || m.toUserId === myName)) || m.toUserId === adminId;
                return isFromMe || isToMe;
            }).sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));

            const partnerName = role === 'supplier' ? '羅德精技' : '老闆';
            const partnerColor = role === 'supplier' ? 'bg-slate-800' : 'bg-amber-500';
            const partnerInitial = role === 'supplier' ? '羅' : '管';
            const isOffline = (() => {
                const admin = (state.users || []).find(u => u.role === 'admin');
                if (!admin?.lastSeen) return true;
                const lastSeenTime = admin.lastSeen.seconds ? admin.lastSeen.seconds * 1000 : new Date(admin.lastSeen).getTime();
                return (Date.now() - lastSeenTime) > 60 * 1000;  // v106: 1 分鐘
            })();
            const statusText = isOffline ? '🔴 離線' : '🟢 線上';

            return `<div class="p-4 md:p-8 pb-32 animate-fade-in h-full flex flex-col pt-20 md:pt-8">
                <div class="mb-4">
                    <h2 class="text-2xl font-bold text-slate-800">💬 聯絡管理員</h2>
                    <p class="text-sm text-slate-500 mt-1">${statusText}</p>
                </div>
                <div class="bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col flex-1" style="max-width: 700px; margin: 0 auto; width: 100%;">
                    <!-- 對話 header -->

                        <div class="w-12 h-12 rounded-full ${partnerColor} text-white flex items-center justify-center text-xl font-bold">${partnerInitial}</div>
                        <div class="flex-1">
                            <div class="font-bold">${partnerName} (管理員)</div>
                            <div class="text-xs text-slate-500">${statusText}</div>
                        </div>
                        ${isOffline ? '<span class="text-[10px] bg-red-100 text-red-700 px-2 py-1 rounded font-bold">已離線</span>' : '<span class="text-[10px] bg-green-100 text-green-700 px-2 py-1 rounded font-bold">在線中</span>'}
                    </div>
                    <!-- 對話內容 -->
                    <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50" style="min-height: 400px; max-height: 60vh;">
                        ${messages.length === 0 ? `
                            <div class="text-center py-12 text-slate-400">
                                <i data-lucide="message-square" class="w-12 h-12 mx-auto mb-3 opacity-30"></i>
                                <p>還沒有任何訊息</p>
                                <p class="text-xs mt-1">傳第一則訊息給老闆吧!</p>
                            </div>
                        ` : messages.map(m => renderMessageBubble(m, role)).join('')}
                    </div>
                    <!-- 輸入框 -->
                    <form onsubmit="window.sendMessage(event)" class="p-3 border-t bg-white flex gap-2">
                        <textarea name="content" required rows="1" placeholder="輸入訊息給${partnerName}..." class="flex-1 border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 resize-none" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); this.form.requestSubmit();}"></textarea>
                        <button type="submit" class="bg-blue-600 text-white px-5 py-2 rounded-lg font-bold text-sm flex items-center gap-1">
                            <i data-lucide="send" class="w-4 h-4"></i> 送出
                        </button>
                    </form>
                </div>
            </div>`;
        }

        // ============ v106 新版: 管理員版 (對話清單 + 對話) ============
        function renderMessagesAdmin() {
            // 找出所有對話對象 (排除自己)
            const conversations = {};
            (state.messages || []).forEach(m => {
                if (m.type === 'order_alert' || m.type === 'repair_alert' || m.type === 'product_alert') return;
                let partnerId, partnerName, partnerRole;
                if (m.fromRole === 'admin') {
                    partnerId = m.toUserId;
                    const u = (state.users || []).find(x => x.uid === m.toUserId || x.name === m.toUserId || x.username === m.toUserId);
                    partnerName = u?.name || m.toUserId;
                    partnerRole = u?.role || 'client';
                } else {
                    const u = (state.users || []).find(x => x.name === m.fromName);
                    partnerId = u?.uid || m.fromName;
                    partnerName = m.fromName;
                    partnerRole = m.fromRole || 'client';
                }
                if (!partnerId || partnerId === state.currentUser?.uid) return;
                if (!conversations[partnerId]) {
                    conversations[partnerId] = { id: partnerId, name: partnerName, role: partnerRole, lastMsg: m, unread: 0, lastTime: 0 };
                }
                const t = m.createdAt?.seconds || 0;
                if (t > conversations[partnerId].lastTime) {
                    conversations[partnerId].lastTime = t;
                    conversations[partnerId].lastMsg = m;
                }
                if (!m.read && m.toUserId === state.currentUser?.uid) conversations[partnerId].unread++;
            });
            const convList = Object.values(conversations).sort((a, b) => b.lastTime - a.lastTime);
            // 決定目前選中的對話
            if (!state.activeMessageConv && convList.length > 0) state.activeMessageConv = convList[0].id;
            const activeConv = conversations[state.activeMessageConv];
            const activeMessages = activeConv ? (state.messages || []).filter(m => {
                if (m.type === 'order_alert' || m.type === 'repair_alert' || m.type === 'product_alert') return false;
                const u = (state.users || []).find(x => x.name === m.fromName);
                const uId = u?.uid || m.fromName;
                const tId = activeConv.id;
                return (uId === tId && m.fromRole !== 'admin') || (m.toUserId === tId && m.fromRole === 'admin');
            }).sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0)) : [];

            return `<div class="p-4 md:p-6 animate-fade-in h-full flex flex-col pt-20 md:pt-6">
                <div class="mb-3">
                    <h2 class="text-2xl font-bold text-slate-800">💬 留言板</h2>
                    <p class="text-sm text-slate-500 mt-1">所有客戶和供應商的訊息</p>
                </div>
                <div class="bg-white rounded-2xl shadow-lg overflow-hidden grid grid-cols-1 md:grid-cols-3 flex-1" style="min-height: 600px;">
                    <!-- 左: 對話清單 -->
                    <div class="border-r border-slate-200 bg-slate-50 md:max-h-[80vh] md:overflow-y-auto">
                        <div class="p-3 border-b bg-white">
                            <input type="text" placeholder="🔍 搜尋對象..." class="w-full border rounded px-2 py-1.5 text-xs">
                        </div>
                        ${convList.length === 0 ? `
                            <div class="p-8 text-center text-slate-400 text-sm">
                                <i data-lucide="users" class="w-10 h-10 mx-auto mb-2 opacity-30"></i>
                                <p>還沒有對話</p>
                            </div>
                        ` : convList.map(c => {
                            const isActive = c.id === state.activeMessageConv;
                            const roleLabel = c.role === 'supplier' ? '供應商' : '客戶';
                            const roleBg = c.role === 'supplier' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700';
                            const lastMsgText = c.lastMsg?.content || '';
                            const lastTimeText = c.lastTime ? new Date(c.lastTime * 1000).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
                            return `<div class="relative group border-b ${isActive ? 'bg-blue-50 border-l-4 border-blue-500' : ''}">
                                <div onclick="window.selectConversation('${c.id}')" class="p-3 cursor-pointer hover:bg-white pr-10">
                                    <div class="flex justify-between items-start mb-1">
                                        <span class="font-bold text-sm">${c.name} <span class="px-1.5 py-0.5 rounded text-[9px] ${roleBg}">${roleLabel}</span></span>
                                        <span class="text-[10px] text-slate-400">${lastTimeText}</span>
                                    </div>
                                    <div class="text-xs text-slate-500 truncate">${lastMsgText}</div>
                                    ${c.unread > 0 ? `<span class="inline-block mt-1 px-1.5 py-0.5 bg-red-500 text-white rounded-full text-[9px] font-bold">${c.unread} 未讀</span>` : ''}
                                </div>
                                <button onclick="event.stopPropagation(); if(confirm('刪除與「${c.name}」的所有訊息?')) window.deleteConversation('${c.id}', '${c.name}')" class="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded bg-red-50 text-red-500 hover:bg-red-100 opacity-0 group-hover:opacity-100 flex items-center justify-center" title="刪除此對話">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>`;
                        }).join('')}
                    </div>
                    <!-- 右: 對話內容 -->
                    <div class="md:col-span-2 flex flex-col">
                        ${activeConv ? `
                            <div class="p-3 border-b bg-white flex justify-between items-center">
                                <div>
                                    <div class="font-bold text-sm">${activeConv.name} <span class="px-1.5 py-0.5 rounded text-[10px] ${activeConv.role === 'supplier' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">${activeConv.role === 'supplier' ? '供應商' : '客戶'}</span></div>
                                    <div class="text-[10px] text-slate-500">${(() => { const u = (state.users || []).find(x => x.uid === activeConv.id || x.name === activeConv.id); if (!u?.lastSeen) return '🔴 離線'; const t = u.lastSeen.seconds ? u.lastSeen.seconds * 1000 : new Date(u.lastSeen).getTime(); const s = (Date.now() - t) / 1000; return s > 60 ? '🔴 離線' : '🟢 線上'; })()}</div>
                                </div>
                                <div class="flex gap-1">
                                    <button class="text-[10px] bg-slate-100 px-2 py-1 rounded">📋 訂單</button>
                                    <button onclick="window.deleteConversation('${activeConv.id}', '${activeConv.name}')" class="text-[10px] bg-red-50 text-red-600 hover:bg-red-100 px-2 py-1 rounded font-bold flex items-center gap-1" title="刪除此對話所有訊息"><i data-lucide="trash-2" class="w-3 h-3"></i>清空</button>
                                </div>
                            </div>
                            <div id="messagesContainer" class="flex-1 overflow-y-auto p-3 space-y-2 bg-slate-50" style="min-height: 400px; max-height: 60vh;">
                                ${activeMessages.length === 0 ? `
                                    <div class="text-center py-12 text-slate-400 text-sm">開始對話吧!</div>
                                ` : activeMessages.map(m => renderMessageBubble(m, 'admin')).join('')}
                            </div>
                            <form onsubmit="window.sendMessage(event)" class="p-2 border-t bg-white flex gap-1">
                                <input type="hidden" name="toUserId" value="${activeConv.id}">
                                <textarea name="content" required rows="1" placeholder="回覆 ${activeConv.name}..." class="flex-1 border rounded-lg px-2 py-1.5 text-sm resize-none focus:ring-2 focus:ring-blue-500" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); this.form.requestSubmit();}"></textarea>
                                <button type="submit" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold">送出</button>
                            </form>
                        ` : `
                            <div class="flex-1 flex items-center justify-center text-slate-400">
                                <div class="text-center">
                                    <i data-lucide="message-circle" class="w-16 h-16 mx-auto mb-3 opacity-30"></i>
                                    <p>選擇左邊的對話開始</p>
                                </div>
                            </div>
                        `}
                    </div>
                </div>
            </div>`;
        }

        // ============ 共用: 渲染單則訊息氣泡 ============
        function renderMessageBubble(m, viewerRole) {
            const isMine = m.fromRole === viewerRole || (m.fromUserId === state.currentUser?.uid) || (m.fromName === state.currentUser?.name);
            const time = m.createdAt?.seconds ? new Date(m.createdAt.seconds * 1000).toLocaleString('zh-TW', { hour: '2-digit', minute: '2-digit', month: 'numeric', day: 'numeric' }) : '剛剛';
            let displayName = m.fromName, roleColor = 'bg-slate-400', roleLabel = '';
            if (m.fromRole === 'admin') {
                displayName = viewerRole === 'client' ? '老闆' : (viewerRole === 'supplier' ? '羅德精技' : '我');
                roleColor = 'bg-amber-500'; roleLabel = '管理員';
            } else if (m.fromRole === 'supplier') {
                roleColor = 'bg-purple-500'; roleLabel = '供應商';
            } else {
                displayName = viewerRole === 'client' ? '我' : m.fromName;
                roleColor = 'bg-blue-500'; roleLabel = '客戶';
            }
            const bubbleColor = isMine ? 'bg-blue-600 text-white' : 'bg-white border';
            const dir = isMine ? 'flex-row-reverse' : '';
            // v106: 管理員可在每則訊息加刪除按鈕
            const canDelete = viewerRole === 'admin' && m.docId;
            return `<div class="flex gap-2 ${dir} group">
                <div class="w-8 h-8 rounded-full ${roleColor} text-white flex items-center justify-center text-xs font-bold shrink-0">${(displayName||'?')[0]}</div>
                <div class="flex-1 max-w-[80%] ${isMine ? 'text-right' : ''}">
                    <div class="text-[10px] text-slate-500 mb-0.5">${displayName} · ${time}</div>
                    <div class="inline-flex items-start gap-1 ${isMine ? 'flex-row-reverse' : ''}">
                        <div class="inline-block ${bubbleColor} px-3 py-2 rounded-2xl ${isMine ? 'rounded-tr-sm' : 'rounded-tl-sm'} text-sm whitespace-pre-wrap text-left">${m.content}</div>
                        ${canDelete ? `<button onclick="window.deleteMessage('${m.docId}')" class="opacity-30 group-hover:opacity-100 transition-opacity text-red-500 hover:bg-red-50 rounded p-1 shrink-0" title="刪除此訊息"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : ''}
                    </div>
                </div>
            </div>`;
        }

        // 管理員選擇對話
        window.selectConversation = (convId) => { state.activeMessageConv = convId; renderApp(); };

        // v106: 刪除單則訊息 (管理員)
        window.deleteMessage = async (docId) => {
            if (!docId) return;
            if (!confirm('確定刪除這則訊息?')) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'messages', docId));
                showToast('✓ 訊息已刪除', 'success', 2000);
            } catch (e) {
                console.error('[v106 刪除訊息失敗]', e);
                showToast('刪除失敗: ' + e.message, 'error', 3000);
            }
        };

        // v106: 刪除整個對話 (管理員, 一次清掉某人所有訊息)
        window.deleteConversation = async (partnerId, partnerName) => {
            if (!partnerId) return;
            const msgCount = (state.messages || []).filter(m => {
                if (m.type === 'order_alert' || m.type === 'repair_alert' || m.type === 'product_alert') return false;
                if (m.fromRole === 'admin' && m.toUserId === partnerId) return true;
                if (m.fromRole !== 'admin') {
                    const u = (state.users || []).find(x => x.name === m.fromName);
                    const uId = u?.uid || m.fromName;
                    if (uId === partnerId) return true;
                }
                return false;
            }).length;
            if (!confirm(`確定刪除「${partnerName || partnerId}」的 ${msgCount} 則訊息?\n\n(此操作無法復原)`)) return;
            showToast('刪除中...', 'info', 1500);
            try {
                const toDelete = (state.messages || []).filter(m => {
                    if (m.type === 'order_alert' || m.type === 'repair_alert' || m.type === 'product_alert') return false;
                    if (m.fromRole === 'admin' && m.toUserId === partnerId) return true;
                    if (m.fromRole !== 'admin') {
                        const u = (state.users || []).find(x => x.name === m.fromName);
                        const uId = u?.uid || m.fromName;
                        if (uId === partnerId) return true;
                    }
                    return false;
                });
                let success = 0, fail = 0;
                for (const m of toDelete) {
                    if (m.docId) {
                        try {
                            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'messages', m.docId));
                            success++;
                        } catch (e) {
                            console.warn('刪除失敗', m.docId, e);
                            fail++;
                        }
                    }
                }
                showToast(`✓ 已刪除 ${success} 則${fail > 0 ? ` (${fail} 失敗)` : ''}`, 'success', 3000);
            } catch (e) {
                console.error('[v106 刪除對話失敗]', e);
                showToast('刪除失敗: ' + e.message, 'error', 3000);
            }
        };

        // ============ 浮動「回上一頁」圓形按鈕 (全部角色) ============
        function renderFloatingBackButton() {
            if (!state.currentUser) return '';
            // 沒上一頁就不顯示 (在首頁/歡迎頁/login 時)
            if (state.viewHistory.length === 0) return '';
            if (state.currentView === 'welcome') return '';
            return `<button onclick="window.goBack()" class="floating-back-btn fixed left-1/2 -translate-x-1/2 z-40 w-14 h-14 md:w-16 md:h-16 rounded-full bg-[#255a9e] text-white shadow-2xl flex flex-col items-center justify-center border-4 border-white active:scale-95 transition-transform hover:scale-110" style="bottom: max(80px, env(safe-area-inset-bottom, 0px) + 60px);" title="回上一頁">
                <i data-lucide="arrow-up" class="w-6 h-6 md:w-7 md:h-7"></i>
                <span class="text-[9px] md:text-[10px] font-bold mt-0.5">上一頁</span>
            </button>
            <style>
                .floating-back-btn {
                    animation: back-pulse 2s ease-in-out infinite;
                }
                @keyframes back-pulse {
                    0%, 100% { box-shadow: 0 4px 20px rgba(37, 90, 158, 0.4), 0 0 0 0 rgba(37, 90, 158, 0.5); }
                    50% { box-shadow: 0 4px 30px rgba(37, 90, 158, 0.6), 0 0 0 14px rgba(37, 90, 158, 0); }
                }
                @media (max-width: 768px) {
                    .floating-back-btn { bottom: 70px !important; }
                }
            </style>`;
        }

        function renderApp() {
            const app = document.getElementById('app');
            if(!app) return;

            // Save cursor position if typing
            const focusedId = document.activeElement ? document.activeElement.id : null;
            const cursorPosition = (document.activeElement && (document.activeElement.type === 'text' || document.activeElement.type === 'search')) ? document.activeElement.selectionStart : undefined;

            if (!state.currentUser) {
                app.innerHTML = renderLogin() + renderForgotModal() + renderRegisterModal();
            } else {
                let mainContent = '';
                if(state.currentView === 'welcome') { mainContent = renderWelcome(); }
                else if(state.currentView === 'dashboard') mainContent = renderDashboard();
                else if(state.currentView === 'shop') mainContent = renderShop();
                else if(state.currentView === 'products') mainContent = renderProductList();
                else if(state.currentView === 'orders') mainContent = renderOrders();
                else if(state.currentView === 'expenses') mainContent = renderExpenses();
                else if(state.currentView === 'users') mainContent = renderUserManagement();
                else if(state.currentView === 'repair_client') mainContent = renderClientRepair();
                else if(state.currentView === 'repair_admin') mainContent = renderAdminRepairs();
                else if(state.currentView === 'announcements') mainContent = renderAnnouncements();
                else if(state.currentView === 'messages') mainContent = renderMessages();
                else if(state.currentView === 'crm') mainContent = `
                    <div class="p-4 md:p-8 animate-fade-in h-full flex flex-col pt-20 md:pt-8">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold text-slate-800">聯絡資訊 (CRM)</h2>
                        </div>
                        <div class="bg-white p-1 rounded-lg border border-slate-200 shadow-sm flex mb-4 max-w-md">
                            <button onclick="window.setCRMView('list', 'client')" class="flex-1 py-2 px-4 rounded-md text-sm font-bold transition-all ${state.crmType==='client'?'bg-slate-800 text-white':'text-slate-500 hover:bg-slate-50'}">診所 / 藥局</button>
                            <button onclick="window.setCRMView('list', 'supplier')" class="flex-1 py-2 px-4 rounded-md text-sm font-bold transition-all ${state.crmType==='supplier'?'bg-slate-800 text-white':'text-slate-500 hover:bg-slate-50'}">供應商</button>
                        </div>
                        <div class="mb-4">
                            <input id="crmSearchInput" type="text" oninput="window.handleCRMSearch(this.value)" value="${state.crmSearch}" placeholder="搜尋名稱或電話..." class="w-full md:max-w-md border border-slate-300 rounded-lg px-4 py-2 text-sm shadow-sm focus:border-blue-500 outline-none transition-colors">
                        </div>
                        ${state.crmType === 'client' && !state.crmSearch ? `<div class="flex gap-2 overflow-x-auto pb-2 mb-2 custom-scrollbar"><button onclick="window.setCRMView('list','client',undefined)" class="whitespace-nowrap px-3 py-1 rounded-full text-xs font-bold border ${state.activeCity===undefined?'bg-blue-600 text-white border-blue-600':'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}">全部</button>${TAIWAN_CITIES.map(c=>`<button onclick="window.setCRMView('list','client','${c}')" class="whitespace-nowrap px-3 py-1 rounded-full text-xs font-bold border ${state.activeCity===c?'bg-blue-600 text-white border-blue-600':'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}">${c}</button>`).join('')}</div>` : ''}
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 overflow-hidden flex flex-col">
                            <div class="overflow-x-auto custom-scrollbar flex-1">
                                <table class="w-full text-left text-sm">
                                    <thead class="bg-slate-50 text-slate-600 sticky top-0 z-10 border-b border-slate-200">
                                        <tr><th class="p-4">名稱</th>${state.crmType==='client'?'<th class="p-4">類型</th>':''}<th class="p-4">電話</th>${state.crmType==='client'?'<th class="p-4">紙軸規格備註</th>':''}<th class="p-4">操作</th></tr>
                                    </thead>
                                    <tbody id="crmListBody" class="divide-y divide-slate-100">
                                        ${window.generateCRMRows()}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>`;
                else if(state.currentView === 'contact') mainContent = renderContact();

                app.innerHTML = `<div class="flex h-full w-full relative">${renderSidebar()}<div class="flex-1 flex flex-col h-full relative overflow-hidden bg-[#f8fafc]">${renderNotificationBell()}${mainContent}${renderFloatingBackButton()}</div></div>` + `
                ${renderProductModal()}
                ${renderPaymentModal()}
                ${renderExpenseModal()}
                ${renderRegisterModal()}
                ${renderProfileModal()}
                ${renderImagePreviewModal()}
                ${state.showClientRepairDetail?renderClientRepairDetail():''}
                ${state.showAdminOrderModal?renderAdminOrderModal():''}
                ${state.showOrderEditModal?renderOrderEditModal():''}
                ${state.showHistoryModal?renderHistoryModal():''}
                ${state.showShipmentModal?renderShipmentModal():''}
                ${state.showOrderConfirmModal?renderOrderConfirmModal():''}
                ${state.showBagPriceTable?renderBagPriceTable():''}
                ${state.showPublicBagModal?renderPublicBagModal():''}
                ${state.showCustomBagModal?renderCustomBagModal():''}`;
                // 公版大卡: 進去後自動算一次初始價格
                if (state.activeCategory === 'medicine_bag' && state.productNav.view === 'bag_standard') {
                    setTimeout(() => {
                        document.querySelectorAll('[data-bag-card-sup]').forEach(card => {
                            const supName = card.getAttribute('data-bag-card-sup');
                            const sizeEl = card.querySelector('[id$="_size"]');
                            if (supName && sizeEl) {
                                const cardId = sizeEl.id.replace('_size', '');
                                if (typeof updateBagStandardPrice === 'function') updateBagStandardPrice(supName, cardId);
                            }
                        });
                    }, 50);
                }
            }
            lucide.createIcons();
            // 把公告 modal append 到 body
            const annContainer = document.getElementById('announcement-modal-container');
            if (annContainer) annContainer.innerHTML = renderAnnouncementModal();
            else {
                const div = document.createElement('div');
                div.id = 'announcement-modal-container';
                div.innerHTML = renderAnnouncementModal();
                document.body.appendChild(div);
            }
            lucide.createIcons();
            // 初始化 12 個月利潤 Chart.js
            if (typeof Chart !== 'undefined' && window._monthChartData) {
                setTimeout(() => window.initMonthProfitChart(), 50);
            } else if (window._monthChartData) {
                // Chart.js 還沒載入完成, 等一下
                const checkChart = setInterval(() => {
                    if (typeof Chart !== 'undefined') {
                        clearInterval(checkChart);
                        window.initMonthProfitChart();
                    }
                }, 100);
                setTimeout(() => clearInterval(checkChart), 10000);
            }

            if (focusedId) {
                const el = document.getElementById(focusedId);
                if (el && focusedId !== 'orderSearchInput' && focusedId !== 'crmSearchInput' && focusedId !== 'adminClientSearchInput') {
                    el.focus();
                    if (cursorPosition !== undefined && (el.type === 'text' || el.type === 'search')) {
                        el.setSelectionRange(cursorPosition, cursorPosition);
                    }
                }
            }
        }

        // 頁面開啟時, 自動還原登入 (從 localStorage) + 重新查最新 user 資料
        setTimeout(async () => {
            if (!state.currentUser) {
                try {
                    const savedUsername = localStorage.getItem('lastLoggedInUser');
                    if (savedUsername) {
                        // 先用 cache 找
                        let u = state.users.find(x => x.username === savedUsername);
                        if (u && u.docId) {
                            try {
                                // 從 Firestore 重新查最新資料 (避免用舊 role/權限登入)
                                const freshSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', u.docId));
                                if (freshSnap.exists()) {
                                    const freshData = { ...freshSnap.data(), id: freshSnap.data().id || freshSnap.id, docId: freshSnap.id };
                                    // 比較是否有差異 (role / type / name), 有差就用新的
                                    if (freshData.role !== u.role || freshData.type !== u.type || freshData.name !== u.name) {
                                        console.log('[自動登入] 用戶資料有更新, 使用最新資料:', freshData);
                                        // 也更新 state.users 裡的快取
                                        const idx = state.users.findIndex(x => x.docId === u.docId);
                                        if (idx >= 0) state.users[idx] = { ...state.users[idx], ...freshData };
                                        u = { ...u, ...freshData };
                                    }
                                } else {
                                    // 用戶已被刪除, 清除 localStorage
                                    console.warn('[自動登入] 用戶不存在, 清除登入狀態');
                                    localStorage.removeItem('lastLoggedInUser');
                                    return;
                                }
                            } catch (e) {
                                console.warn('[自動登入] 查最新資料失敗, 用 cache:', e.message);
                            }
                        }
                        if (u) {
                            console.log('[自動登入] 還原使用者:', u.username, 'role:', u.role);
                            state.currentUser = u;
                            state.currentView = 'welcome';
                            state.loginMode = 'select';
                            renderApp();
                            // v106: 自動登入也啟動 lastSeen 定期更新
                            setTimeout(() => { if (window.updateLastSeen) window.updateLastSeen(); }, 1000);
                            setInterval(() => { if (window.updateLastSeen) window.updateLastSeen(); }, 60000);
                        }
                    }
                } catch (e) {}
            }
        }, 1500);

        renderApp();
        window.state = state;
    </script>
