!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>羅德精技醫材訂貨系統 (Ver 5.2.7 Logo展開版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .font-serif { font-family: 'Noto Serif TC', serif; }
        input, select, textarea { font-size: 16px !important; } 
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
        @media (min-width: 640px) { .product-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; } }
        @media (min-width: 1024px) { .product-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.5rem; } }
        .category-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        @media (min-width: 640px) { .category-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .category-grid { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); } }
        .product-card { transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:active { transform: scale(0.98); }
        @media (min-width: 768px) { .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.1); } }
        .img-container { width: 100%; aspect-ratio: 1/1; background-color: #f1f5f9; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 0.5rem; position: relative; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .category-card-elegant {
            background: white; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; height: 140px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; position: relative; overflow: hidden;
        }
        @media (min-width: 768px) { .category-card-elegant { height: 180px; padding: 24px; } }
        .cat-icon-bg { position: absolute; right: -10px; bottom: -10px; opacity: 0.08; transform: rotate(-15deg); width: 80px; height: 80px; }
        /* Mobile Modal Fullscreen */
        @media (max-width: 640px) {
            .mobile-modal { width: 100% !important; height: 100% !important; max-height: 100% !important; border-radius: 0 !important; display: flex; flex-direction: column; }
            .mobile-modal-content { flex: 1; overflow-y: auto; }
        }
        .img-preview-overlay { background-color: rgba(0, 0, 0, 0.9); }
        .chat-bubble { position: relative; padding: 12px; border-radius: 12px; max-width: 85%; }
        .chat-bubble-user { background-color: #eff6ff; color: #1e3a8a; border-bottom-right-radius: 2px; margin-left: auto; }
        .chat-bubble-admin { background-color: #f8fafc; color: #334155; border: 1px solid #e2e8f0; border-bottom-left-radius: 2px; margin-right: auto; }
        .clickable-card:active { transform: scale(0.98); }
        
        .bg-elegant { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); }
        .btn-noble { background: linear-gradient(to right, #2c3e50, #4ca1af); box-shadow: 0 4px 15px rgba(44, 62, 80, 0.3); }
        .text-gold { color: #b78628; }
        
        /* Logo Specific Styles */
        .logo-text-zh { color: #255a9e; } /* Corporate Blue */
        .logo-text-en { color: #255a9e; }
        .logo-divider { background-color: #255a9e; }
    </style>
</head>
<body class="text-slate-800 h-screen w-full overflow-hidden flex flex-col bg-slate-50">

    <div id="app" class="h-full w-full flex flex-col relative overflow-hidden"></div>
    <div id="message-container" class="fixed top-4 right-4 left-4 md:left-auto md:w-96 z-[100] pointer-events-none"></div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, where, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const LOCAL_FIREBASE_CONFIG = {
            apiKey: "AIzaSyCnGvyHtX7BADHQOoCsimWjT191YEgaoJs",
            authDomain: "roadbiomed-28961.firebaseapp.com",
            projectId: "roadbiomed-28961",
            storageBucket: "roadbiomed-28961.firebasestorage.app",
            messagingSenderId: "898023786208",
            appId: "1:898023786208:web:ce4e3b605f4b8f159eb285",
            measurementId: "G-CLG0WM8T3P"
        };

        let firebaseConfig, app, auth, db, isConfigured = false, appId = 'road-v1';

        try {
            if (LOCAL_FIREBASE_CONFIG && LOCAL_FIREBASE_CONFIG.apiKey) { 
                firebaseConfig = LOCAL_FIREBASE_CONFIG; isConfigured = true; 
            } else if (typeof __firebase_config !== 'undefined' && __firebase_config) { 
                firebaseConfig = JSON.parse(__firebase_config); appId = typeof __app_id !== 'undefined' ? __app_id : appId; isConfigured = true; 
            }

            if (isConfigured) {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            }
        } catch (e) { console.error("Firebase Init Error", e); }

        const TAIWAN_CITIES = [
            "台北市", "新北市", "桃園市", "台中市", "台南市", "高雄市", "基隆市", "新竹市", "嘉義市", 
            "新竹縣", "苗栗縣", "彰化縣", "南投縣", "雲林縣", "嘉義縣", "屏東縣", "宜蘭縣", "花蓮縣", "台東縣", 
            "澎湖縣", "金門縣", "連江縣"
        ];
        
        const CAT_MAP = {
            'machine': '包藥機',
            'paper': '包藥紙卷',
            'medicine_bag': '夾鍊藥袋',
            'parts': '零件',
            'other': '其他'
        };

        const EXPENSE_CATS = {
            'restock': '進貨成本',
            'logistics': '物流運費',
            'transport': '交通費用',
            'office': '辦公雜支',
            'salary': '人事薪資',
            'rent': '房租水電',
            'marketing': '行銷廣告',
            'other': '其他支出'
        };

        // --- State ---
        const state = {
            users: [], currentUser: null, currentView: 'login', loginMode: 'select',
            products: [], orders: [], expenses: [], repairs: [], cart: [],
            isLoading: true,
            showCartModal: false, showProductModal: false, showPaymentModal: false, showExpenseModal: false,
            showRegisterModal: false, showProfileModal: false, showRepairModal: false, showRepairProcessModal: false, 
            showClientRepairDetail: false, showAdminOrderModal: false, showClientHistoryModal: false,
            showShipmentModal: false, 
            activeShipmentOrder: null, 
            registerRole: 'client',
            showImagePreview: false, previewImageUrl: null,
            activePaymentOrderDocId: null, activeRepairId: null, editingProduct: null, editingExpense: null,
            activeCategory: null, activeCity: null, activeClientRepair: null,
            activeHistoryClient: null, historyYearFilter: 'all',
            dashboardView: 'main',
            crmView: 'type', crmType: 'client', crmSearch: '',
            orderFilter: 'all', orderSearch: '',
            adminOrderDraft: { clientId: '', items: [] },
            adminOrderFilters: { clientCity: '', clientSearch: '', prodCategory: '', prodSupplier: '', prodId: '' }
        };

        // --- Helpers ---
        const formatMoney = (n) => new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', minimumFractionDigits: 0 }).format(n);
        const generateOrderId = () => {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hour = String(now.getHours()).padStart(2, '0');
            const minute = String(now.getMinutes()).padStart(2, '0');
            const second = String(now.getSeconds()).padStart(2, '0');
            return `ORD-${year}${month}${day}-${hour}${minute}${second}`;
        };
        const showToast = (msg, type = 'success') => {
            const container = document.getElementById('message-container');
            const el = document.createElement('div');
            el.className = `flex items-center p-4 mb-3 rounded-xl shadow-lg border-l-4 animate-fade-in bg-white ${type==='success'?'border-emerald-500 text-emerald-800':'border-red-500 text-red-800'}`;
            el.innerHTML = `<i data-lucide="${type==='success'?'check-circle':'alert-circle'}" class="w-5 h-5 mr-3 flex-shrink-0"></i><span class="font-medium text-sm">${msg}</span>`;
            container.appendChild(el); lucide.createIcons(); setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2500);
        };

        // --- CRITICAL GLOBAL FUNCTIONS (Window Scope) ---
        
        window.deleteOrder = async (e, docId) => {
            if(e) e.stopPropagation();
            if(!docId) return showToast("訂單ID無效", "error");
            if(confirm("確定要永久刪除此訂單嗎？\n此動作無法復原！")) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'orders', docId));
                    showToast("訂單已刪除");
                } catch(err) { console.error(err); showToast("刪除失敗: " + err.message, "error"); }
            }
        };

        window.deleteUser = async (e, docId) => {
            if(e) e.stopPropagation();
            if (!docId) return showToast("使用者ID無效", 'error');
            const user = state.users.find(u => u.docId === docId);
            if (!user) return showToast("找不到使用者", 'error');
            if (user.username === state.currentUser.username) return showToast("不能刪除自己", 'error');
            if (confirm(`確定刪除帳號: ${user.name}？\n所有相關資料將被移除。`)) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', docId));
                    showToast("帳號已刪除");
                } catch(err) { console.error(err); showToast("刪除失敗: " + err.message, 'error'); }
            }
        };

        window.toggleAdmin = async (e, docId) => {
            if(e) e.stopPropagation();
            if (!docId) return showToast("使用者ID無效", 'error');
            const user = state.users.find(u => u.docId === docId);
            if (!user) return showToast("找不到使用者", 'error');
            if (user.username === state.currentUser.username) return showToast("不能變更自己的權限", 'error');
            const newRole = user.role === 'admin' ? (user.type === 'supplier' ? 'supplier' : 'client') : 'admin';
            const roleName = newRole === 'admin' ? '管理員' : '一般用戶';
            if(confirm(`確定將 ${user.name} 的權限變更為 [${roleName}]？`)) {
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', docId), { role: newRole });
                    showToast(`權限已更新為 ${roleName}`);
                } catch(err) { console.error(err); showToast("更新失敗: " + err.message, 'error'); }
            }
        };

        window.deleteProduct = async (e, docId) => {
            if(e) e.stopPropagation();
            if (!docId) return showToast("產品ID無效", 'error');
            if(confirm("確定刪除此產品？\n此動作無法復原。")) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'products', docId));
                    showToast("產品已刪除");
                } catch(err) { console.error(err); showToast("刪除失敗: " + err.message, 'error'); }
            }
        };

        window.deleteExpense = async (e, docId) => {
            if(e) e.stopPropagation();
            if (!docId) return showToast("支出ID無效", 'error');
            if(confirm("確定刪除此筆支出記錄？")) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'expenses', docId));
                    showToast("支出記錄已刪除");
                } catch(err) { console.error(err); showToast("刪除失敗: " + err.message, 'error'); }
            }
        }

        window.setAdminOrderClient = (id) => { state.adminOrderDraft.clientId = id; renderApp(); };
        window.setAdminClientFilter = (k,v) => { state.adminOrderFilters[k] = v; renderApp(); };
        window.setAdminProductFilter = (k,v) => { 
            state.adminOrderFilters[k] = v;
            if(k==='prodCategory') { state.adminOrderFilters.prodSupplier=''; state.adminOrderFilters.prodId=''; }
            else if(k==='prodSupplier') { state.adminOrderFilters.prodId=''; }
            renderApp();
        };
        window.adjustAdminQty = (d) => {
            const el = document.getElementById('adminOrderQty');
            if(el) { let v=parseInt(el.value)||1; v+=d; if(v<1)v=1; el.value=v; }
        };

        // --- Data Listeners ---
        const initDataListeners = () => {
            const collections = ['users', 'products', 'orders', 'expenses', 'repairs'];
            collections.forEach(col => {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', col), (snap) => {
                    const data = snap.docs.map(d => {
                        const docData = d.data();
                        return { ...docData, id: docData.id || d.id, docId: d.id };
                    });
                    if(col==='orders') state.orders = data.sort((a,b)=>new Date(b.date)-new Date(a.date));
                    else if(col==='repairs') state.repairs = data.sort((a,b)=>b.createdAt - a.createdAt);
                    else if(col==='expenses') state.expenses = data.sort((a,b)=>new Date(b.date)-new Date(a.date));
                    else state[col] = data;
                    if(col==='users') {
                        state.isLoading = false; 
                        if(state.currentUser) state.currentUser = data.find(u=>u.username===state.currentUser.username) || state.currentUser;
                    }
                    renderApp();
                }, err => { console.error(err); state.isLoading = false; renderApp(); });
            });
        };

        if (isConfigured) {
            const initAuthFlow = async () => {
                try {
                    if (LOCAL_FIREBASE_CONFIG.apiKey) await signInAnonymously(auth);
                    else if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                    else await signInAnonymously(auth);
                } catch (e) { console.error("Auth", e); }
            };
            initAuthFlow();
            onAuthStateChanged(auth, u => { if(u) initDataListeners(); });
        }

        // --- Other Window Functions ---
        window.setLoginMode = m => { state.loginMode = m; renderApp(); };
        window.handleLogin = e => {
            e.preventDefault(); 
            if(!isConfigured) return alert("請設定 Firebase");
            if(state.users.length === 0 && !state.isLoading) return showToast("目前系統無任何帳號，請先點擊下方註冊", "error");
            
            const f = e.target;
            const inputUser = f.username.value.trim();
            const inputPass = f.password.value.trim();
            const u = state.users.find(x => (x.username === inputUser || x.phone === inputUser) && x.password === inputPass);
            
            if(!u) return showToast('帳號或密碼錯誤', 'error');
            if(state.loginMode === 'client' && u.role !== 'client') return showToast('請由內部/供應商入口登入', 'error');
            if(state.loginMode === 'staff' && u.role === 'client') return showToast('請由醫師/藥師入口登入', 'error');
            
            state.currentUser = u; state.loginMode = 'select';
            state.currentView = u.role==='admin' ? 'dashboard' : (u.role==='supplier' ? 'products' : 'shop');
            showToast(`歡迎回來 ${u.name}`); renderApp();
        };
        
        window.openModal = (type, id=null) => {
            if (type === 'repair') state.showRepairModal = true;
            else if (type === 'profile') state.showProfileModal = true;
            else if (type === 'clientRepairDetail') { state.activeClientRepair = state.repairs.find(r => r.id === id); state.showClientRepairDetail = true; }
            renderApp();
        };
        window.closeModal = (type) => {
            if (type === 'repair') state.showRepairModal = false;
            else if (type === 'profile') state.showProfileModal = false;
            else if (type === 'ClientRepairDetail') state.showClientRepairDetail = false;
            renderApp();
        };
        window.openRegisterModal = (role) => { state.registerRole = role; state.showRegisterModal = true; renderApp(); };
        window.closeRegisterModal = () => { state.showRegisterModal = false; renderApp(); };
        window.handleRegister = async e => {
            e.preventDefault(); 
            const f = e.target;
            if(state.users.some(u=>u.username===f.registerName.value.trim())) return showToast('名稱已存在', 'error');
            const role = state.users.length===0 ? 'admin' : state.registerRole;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'users'), {
                username: f.registerName.value.trim(), password: f.password.value.trim(), role,
                name: f.registerName.value.trim(), phone: f.phone.value.trim(), address: f.address.value.trim(),
                city: f.city.value, type: f.type.value, note: ''
            });
            state.currentUser = { username: f.registerName.value.trim(), role }; 
            state.showRegisterModal = false;
            state.currentView = role==='admin'?'dashboard':(role==='supplier'?'products':'shop');
            showToast('註冊成功');
        };
        window.logout = () => { state.currentUser = null; state.currentView = 'login'; state.cart=[]; renderApp(); };
        window.setView = (v, f=null) => { state.currentView = v; state.dashboardView = 'main'; if(v==='shop') state.activeCategory=null; if(v==='orders' && f) state.orderFilter=f; else state.orderFilter='all'; renderApp(); };
        window.setCategory = (c) => { state.activeCategory = c; renderApp(); };
        window.updateCartModal = (s) => { state.showCartModal = s; renderApp(); };
        window.setCRMView = (v, type=null, city=null) => { state.crmView = v; if(type) state.crmType = type; if(city) state.activeCity = city; state.crmSearch = ''; renderApp(); };
        window.setOrderSearch = (v) => { state.orderSearch = v; renderApp(); };
        window.setCRMSearch = (v) => { state.crmSearch = v; renderApp(); };
        window.setDashboardView = (v) => { state.dashboardView = v; renderApp(); };
        
        // CRM History
        window.openClientHistory = (clientDocId) => {
            const client = state.users.find(u => u.docId === clientDocId);
            if(!client) return;
            state.activeHistoryClient = client;
            state.historyYearFilter = 'all';
            state.showClientHistoryModal = true;
            renderApp();
        };
        window.closeClientHistory = () => { state.showClientHistoryModal = false; renderApp(); };
        window.setHistoryYear = (y) => { state.historyYearFilter = y; renderApp(); };

        // Product/Cart Logic
        window.adjustShopQty = (id, d) => { const el=document.getElementById(`qty-${id}`); if(el){ let v=parseInt(el.value)||1; let m=parseInt(el.min)||1; v+=d; if(v<m)v=m; el.value=v; }};
        window.togglePrintingOption = (id, cb) => {
            const p = state.products.find(x => x.id === id);
            const elPrice = document.getElementById(`price-${id}`);
            const elMoq = document.getElementById(`moq-${id}`);
            const elQty = document.getElementById(`qty-${id}`);
            if(!p || !elPrice || !elQty) return;
            let price = p.priceAfterTax;
            let min = (p.paperSpec === '7cm_folded') ? 20 : (p.paperSpec === '14cm_unfolded' ? 8 : 1);
            if(cb.checked) {
                price = p.pricePrinted || price;
                min = (p.paperSpec === '7cm_folded') ? 100 : 60;
                if(elMoq) elMoq.innerText = `(MOQ: ${min})`;
            } else {
                if(elMoq) elMoq.innerText = `(MOQ: ${min})`;
            }
            elPrice.innerText = formatMoney(price);
            elQty.min = min; elQty.value = min;
        };
        window.addToCart = (id, qtyId, printId) => {
            const p = state.products.find(x => x.id === id);
            let isPrinted = false;
            if(printId) { const cb = document.getElementById(printId); if(cb && cb.checked) isPrinted = true; }
            let pid = p.id, name = p.name, price = p.priceAfterTax, cost = p.cost, min = p.minOrderQty || 1;
            if(p.category === 'paper') {
                if(isPrinted) { pid+='_printed'; name+=' (印刷)'; price=p.pricePrinted||price; cost=p.costPrinted||cost; min=(p.paperSpec==='7cm_folded'?100:60); }
                else { name+=' (空白)'; min=(p.paperSpec==='7cm_folded'?20:8); }
            }
            let qty = 1;
            if(qtyId) { const el = document.getElementById(qtyId); if(el) qty = parseInt(el.value)||1; }
            if(qty < min) return alert(`最低訂購量為 ${min}`);
            const item = state.cart.find(x => x.productId === pid);
            if(item) item.qty += qty;
            else state.cart.push({ productId: pid, name, price, image: p.imageUrl, qty, minQty: min, cost, category: p.category, supplierName: p.supplierName, spec: p.spec });
            showToast(`已加入 ${qty} 件`); renderApp();
        };
        window.updateCartQty = (id, d) => { const i = state.cart.find(x=>x.productId===id); if(i){ i.qty+=d; if(i.qty<i.minQty && d<0) state.cart = state.cart.filter(x=>x.productId!==id); } renderApp(); };
        window.checkout = async () => {
            if(state.cart.length===0) return;
            const note = document.getElementById('orderNoteInput')?.value || '';
            const total = state.cart.reduce((s,i)=>s+i.price*i.qty,0);
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'orders'), {
                id: generateOrderId(), clientId: state.currentUser.username, clientName: state.currentUser.name,
                date: new Date().toISOString().split('T')[0], totalAmount: total, status: 'pending', paymentStatus: 'unpaid',
                orderNote: note, items: state.cart
            });
            state.cart = []; state.showCartModal = false; showToast("訂單已送出"); state.currentView='orders'; renderApp();
        };
        
        // Order Actions
        window.openShipmentModal = (docId) => {
            state.activeShipmentOrder = state.orders.find(o => o.docId === docId);
            state.showShipmentModal = true;
            renderApp();
        };
        window.closeShipmentModal = () => { state.showShipmentModal = false; renderApp(); };
        
        window.confirmShipment = async (e) => {
            e.preventDefault();
            const order = state.activeShipmentOrder;
            if(!order) return;

-center justify-center gap-2"><button onclick="window.openProductModal('${p.id}')" class="text-blue-600 hover:bg-blue-50 p-2 rounded"><i data-lucide="edit-2" class="w-4 h-4"></i></button><button onclick="window.deleteProduct(event, '${p.docId}')" class="text-red-600 hover:bg-red-50 p-2 rounded transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></td></tr>`).join('')}${products.length === 0 ? '<tr><td colspan="8" class="p-8 text-center text-slate-400">目前沒有產品</td></tr>' : ''}</tbody></table></div></div></div>`;

        function renderOrders() {

>' : ''}</tr></thead><tbody class="divide-y divide-slate-100">${orders.map(o => {

${r.diagnosis||''}</textarea></div><div class="flex-1 bg-slate-50 rounded-lg p-4 border border-slate-200 flex flex-col"><div class="flex justify-between items-center mb-2"><label class="block text-sm font-bold text-slate-700">更換零件明細</label><button type="button" onclick="window.addPartRow()" class="text-xs bg-blue-600 text-white px-2 py-1 rounded hover:bg-blue-700">+ 新增零件</button></div><datalist id="partOptions">${partProducts.map(p => `<option value="${p.name}">`).join('')}</datalist><div id="partsListContainer" class="flex-1 overflow-y-auto min-h-[100px] mb-2">${currentParts.map(p => `<div class="grid grid-cols-12 gap-2 mb-2 items-center part-row"><input type="text" list="partOptions" onchange="window.fillPartDetails(this)" value="${p.name}" placeholder="品名" class="col-span-4 border p-2 rounded text-sm bg-white"><input type="number" value="${p.cost}" placeholder="成本" class="col-span-2 border p-2 rounded text-sm bg-gray-50 text-gray-500 part-cost" readonly><input type="number" value="${p.price}" placeholder="單價" class="col-span-3 border p-2 rounded text-sm bg-white part-price" oninput="window.calcRepairTotal()"><input type="number" value="${p.qty}" placeholder="量" class="col-span-2 border p-2 rounded text-sm bg-white part-qty" oninput="window.calcRepairTotal()"><button type="button" onclick="this.parentElement.remove();window.calcRepairTotal()" class="col-span-1 text-red-500 flex justify-center"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`).join('')}</div><div class="grid grid-cols-2 gap-4 border-t border-slate-200 pt-3"><div><label class="block text-xs font-bold text-slate-600 mb-1">維修工資</label><input id="laborCostInput" name="laborCost" type="number" value="${r.laborCost||0}" oninput="window.calcRepairTotal()" class="w-full border border-slate-300 rounded p-2 text-right"></div><div class="text-right"><span class="block text-xs font-bold text-slate-600 mb-1">總計費用</span><span id="repairTotalDisplay" class="text-2xl font-bold text-red-600 font-mono">${formatMoney(r.cost||0)}</span></div></div><div class="mt-2"><label class="flex items-center text-sm font-bold text-slate-700 cursor-pointer"><input type="checkbox" name="hasTransportFee" class="mr-2" onchange="document.getElementById('transportFeeInput').classList.toggle('hidden', !this.checked); window.calcRepairTotal()" ${r.transportFee > 0 ? 'checked' : ''}> 加收交通費</label><input type="number" id="transportFeeInput" name="transportFee" value="${r.transportFee||0}" class="w-full border border-slate-300 rounded p-2 mt-1 ${r.transportFee > 0 ? '' : 'hidden'}" placeholder="請輸入交通費金額" oninput="window.calcRepairTotal()"></div></div><div class="pt-4 border-t border-slate-100"><label class="block text-sm font-bold text-slate-700 mb-2">工單狀態</label><div class="flex gap-4"><label class="flex items-center"><input type="radio" name="status" value="processing" ${r.status==='processing'?'checked':''} class="mr-2"> 維修中 (暫存)</label><label class="flex items-center"><input type="radio" name="status" value="completed" class="mr-2"> 完修 (結案)</label></div></div><button type="submit" class="w-full py-3 bg-slate-800 text-white rounded-lg font-bold shadow-lg hover:bg-slate-900 mt-2">儲存工單</button></form></div></div></div>`;

        function renderDashboard() {
            if (state.dashboardView !== 'main') return renderProfitDetails();
            const pendingOrders = state.orders.filter(o => o.status === 'pending').length;
            const unpaidOrders = state.orders.filter(o => o.paymentStatus === 'unpaid').length;
            const pendingRepairs = state.repairs.filter(r => r.status === 'pending' || r.status === 'processing').length;
            const currentYear = new Date().getFullYear().toString();
            let currentYearProfit = 0, totalProfit = 0;
            state.orders.forEach(o => {
                if (o.status !== 'completed' || o.paymentStatus !== 'paid') return;
                const cost = o.items.reduce((sum, i) => sum + (i.cost || 0) * i.qty, 0);
                const profit = o.totalAmount - cost;
                if (o.date.startsWith(currentYear)) currentYearProfit += profit;
                totalProfit += profit;
            });
            return `<div class="p-4 md:p-8 animate-fade-in overflow-y-auto h-full"><h2 class="text-2xl font-bold text-gray-800 mb-6">營運儀表板</h2><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8"><div onclick="window.setView('repair_admin')" class="clickable-card bg-orange-50 p-6 rounded-xl shadow-sm border border-orange-100 cursor-pointer hover:shadow-md transition-shadow"><div class="flex justify-between items-start mb-4"><div><p class="text-sm text-orange-600 font-medium">待處理維修</p><h3 class="text-3xl font-bold text-orange-700 mt-1">${pendingRepairs}</h3></div><div class="p-2 bg-orange-100 rounded-lg text-orange-600"><i data-lucide="wrench" class="w-6 h-6"></i></div></div></div><div onclick="window.setView('orders','pending')" class="clickable-card bg-white p-6 rounded-xl shadow-sm border border-gray-200 cursor-pointer hover:shadow-md transition-shadow"><div class="flex justify-between items-start mb-4"><div><p class="text-sm text-gray-500 font-medium">新訂單</p><h3 class="text-3xl font-bold text-gray-800 mt-1">${pendingOrders}</h3></div><div class="p-2 bg-yellow-100 rounded-lg text-yellow-600"><i data-lucide="clipboard-list" class="w-6 h-6"></i></div></div></div><div onclick="window.setView('orders','unpaid')" class="clickable-card bg-white p-6 rounded-xl shadow-sm border border-gray-200 cursor-pointer hover:shadow-md transition-shadow"><div class="flex justify-between items-start mb-4"><div><p class="text-sm text-gray-500 font-medium">尚未收款</p><h3 class="text-3xl font-bold text-red-600 mt-1">${unpaidOrders}</h3></div><div class="p-2 bg-red-100 rounded-lg text-red-600"><i data-lucide="credit-card" class="w-6 h-6"></i></div></div></div><div class="bg-blue-50 p-6 rounded-xl shadow-sm border border-blue-100 lg:col-span-1"><div class="flex justify-between items-start mb-4"><div><p class="text-sm text-blue-500 font-medium">系統狀態</p><h3 class="text-xl font-bold text-blue-700 mt-2">${isConfigured?'雲端連線中':'未設定資料庫'}</h3></div><div class="p-2 bg-white rounded-lg text-blue-500"><i data-lucide="${isConfigured?'cloud':'cloud-off'}" class="w-6 h-6"></i></div></div></div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div onclick="window.setDashboardView('profit_year')" class="clickable-card bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between cursor-pointer hover:shadow-md transition-shadow"><div><p class="text-sm text-gray-500 font-medium">本年度已入帳利潤</p><h3 class="text-3xl font-bold text-emerald-600 mt-1">${formatMoney(currentYearProfit)}</h3><p class="text-xs text-slate-400 mt-2">僅計算已出貨且已收款訂單 <i data-lucide="arrow-right" class="w-3 h-3 inline"></i></p></div><div class="p-2 bg-emerald-50 rounded-lg text-emerald-500"><i data-lucide="trending-up" class="w-6 h-6"></i></div></div><div onclick="window.setDashboardView('profit_all')" class="clickable-card bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between cursor-pointer hover:shadow-md transition-shadow"><div><p class="text-sm text-gray-500 font-medium">歷年總獲利</p><h3 class="text-3xl font-bold text-blue-600 mt-1">${formatMoney(totalProfit)}</h3><p class="text-xs text-slate-400 mt-2">點擊查看趨勢 <i data-lucide="arrow-right" class="w-3 h-3 inline"></i></p></div><div class="p-2 bg-blue-50 rounded-lg text-blue-500"><i data-lucide="bar-chart-2" class="w-6 h-6"></i></div></div></div></div>`;
        }

        function renderProfitDetails() {
            const currentYear = new Date().getFullYear().toString();
            let content = '';
            let title = '';

            if (state.dashboardView === 'profit_year') {
                title = `${currentYear} 年度利潤明細 (已完結)`;
                const yearOrders = state.orders.filter(o => o.date.startsWith(currentYear) && o.status === 'completed' && o.paymentStatus === 'paid');
                content = `<table class="w-full text-left text-sm"><thead class="bg-slate-50"><tr><th class="p-4">日期</th><th class="p-4">訂單號</th><th class="p-4">客戶</th><th class="p-4">產品資訊</th><th class="p-4 text-right">營收</th><th class="p-4 text-right">成本(估)</th><th class="p-4 text-right font-bold text-emerald-600">利潤</th></tr></thead><tbody>${yearOrders.map(o => {
                    const cost = o.items.reduce((sum, i) => sum + (i.cost||0)*i.qty, 0);
                    const profit = o.totalAmount - cost;
                    const firstItem = o.items[0] || {};
                    const catName = CAT_MAP[firstItem.category] || firstItem.category || '-';
                    const prodInfo = `
                        <div class="text-xs">
                            <span class="font-bold text-slate-700">${firstItem.name}</span>
                            <div class="text-slate-500">
                                <span class="bg-slate-100 px-1 rounded">${catName}</span>
                                <span class="ml-1">${firstItem.supplierName || '自有'}</span>
                                ${firstItem.spec ? `<span class="ml-1 text-slate-400">(${firstItem.spec})</span>` : ''}
                            </div>
                            ${o.items.length > 1 ? `<span class="text-[10px] text-slate-400 mt-1 block">...等共 ${o.items.length} 項商品</span>` : ''}
                        </div>
                    `;
                    return `<tr class="border-b border-slate-50 hover:bg-slate-50"><td class="p-4 text-slate-500">${o.date}</td><td class="p-4 font-mono text-xs">${o.id}</td><td class="p-4 font-medium">${o.clientName}</td><td class="p-4">${prodInfo}</td><td class="p-4 text-right">${formatMoney(o.totalAmount)}</td><td class="p-4 text-right text-slate-400">${formatMoney(cost)}</td><td class="p-4 text-right font-bold text-emerald-600">${formatMoney(profit)}</td></tr>`;
                }).join('')}</tbody></table>`;
            } else if (state.dashboardView === 'profit_all') {
                title = "歷年獲利總覽 (已完結)";
                const years = {};
                state.orders.forEach(o => {
                    if (o.status !== 'completed' || o.paymentStatus !== 'paid') return;
                    const y = o.date.split('-')[0];
                    const cost = o.items.reduce((sum, i) => sum + (i.cost||0)*i.qty, 0);
                    const profit = o.totalAmount - cost;
                    if (!years[y]) years[y] = { revenue: 0, cost: 0, profit: 0 };
                    years[y].revenue += o.totalAmount;
                    years[y].cost += cost;
                    years[y].profit += profit;
                });
                const sortedYears = Object.keys(years).sort().reverse();
                content = `<table class="w-full text-left text-sm"><thead class="bg-slate-50"><tr><th class="p-4">年度</th><th class="p-4 text-right">總營收</th><th class="p-4 text-right">總成本</th><th class="p-4 text-right font-bold text-emerald-600">總利潤</th></tr></thead><tbody>${sortedYears.map(y => `<tr class="border-b border-slate-50 hover:bg-slate-50"><td class="p-4 font-bold text-lg">${y}</td><td class="p-4 text-right">${formatMoney(years[y].revenue)}</td><td class="p-4 text-right text-slate-400">${formatMoney(years[y].cost)}</td><td class="p-4 text-right font-bold text-emerald-600 text-lg">${formatMoney(years[y].profit)}</td></tr>`).join('')}</tbody></table>`;
            }

            return `<div class="p-4 md:p-8 animate-fade-in h-full flex flex-col"><div class="flex items-center gap-4 mb-6"><button onclick="window.setDashboardView('main')" class="w-10 h-10 rounded-full bg-white border border-slate-200 flex items-center justify-center hover:bg-slate-50 text-slate-600"><i data-lucide="arrow-left" class="w-5 h-5"></i></button><h2 class="text-2xl font-bold text-slate-800">${title}</h2></div><div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 overflow-hidden flex flex-col"><div class="overflow-x-auto custom-scrollbar flex-1">${content}</div></div></div>`;
        }

        function renderProductModal() { 
            if(!state.showProductModal)return''; 
            const p=state.editingProduct||{}; 
            const isEdit=!!p.id;
            const isSupplier = state.currentUser?.role === 'supplier';
            const supplierReadOnly = isSupplier ? 'readonly class="w-full border border-gray-200 bg-gray-100 text-gray-500 rounded p-2"' : 'class="w-full border p-2 rounded"';
            const priceReadOnly = isSupplier ? 'disabled' : '';
            return `<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-sm px-4"><div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden animate-fade-in max-h-[90vh] overflow-y-auto mobile-modal"><div class="p-5 border-b bg-gray-50 flex justify-between sticky top-0"><h3 class="font-bold text-lg">${isEdit?'編輯':'新增'}產品</h3><button onclick="window.closeProductModal()">x</button></div><form id="productForm" onsubmit="window.saveProduct(event)" class="p-6 space-y-4"><div><label class="block text-sm">類別</label><select name="category" onchange="window.onCategoryChange()" class="w-full border p-2 rounded"><option value="machine" ${p.category==='machine'?'selected':''}>包藥機</option><option value="paper" ${p.category==='paper'?'selected':''}>包藥紙卷</option><option value="medicine_bag" ${p.category==='medicine_bag'?'selected':''}>夾鍊藥袋</option><option value="parts" ${p.category==='parts'?'selected':''}>零件</option><option value="other" ${p.category==='other'?'selected':''}>其他</option></select></div><div class="grid grid-cols-2 gap-4"><div id="moqField" style="display:${p.category==='medicine_bag'?'block':'none'}"><label class="block text-sm">MOQ</label><input name="minOrderQty" type="number" value="${p.minOrderQty||1}" class="w-full border p-2 rounded"></div><div id="paperField" style="display:${p.category==='paper'?'block':'none'}"><label class="block text-sm">紙卷規格</label><select name="paperSpec" class="w-full border p-2 rounded" onchange="window.updateBoxPricePreview()"><option value="7cm_folded" ${p.paperSpec==='7cm_folded'?'selected':''}>7公分對折</option><option value="14cm_unfolded" ${p.paperSpec==='14cm_unfolded'?'selected':''}>14公分不對折</option></select><label class="block text-sm mt-2">每箱卷數 (試算用)</label><input name="rollsPerBox" type="number" oninput="window.updateBoxPricePreview()" value="${p.rollsPerBox||''}" class="w-full border p-2 rounded"><label class="block text-sm mt-2 flex items-center"><input type="checkbox" name="hasPrinting" class="mr-2" ${p.hasPrinting?'checked':''} onchange="document.getElementById('printOptions').style.display=this.checked?'block':'none'"> 提供印刷選項?</label></div><div id="printOptions" class="bg-blue-50 p-3 rounded border border-blue-100" style="display:${p.hasPrinting?'block':'none'}"><h4 class="text-xs font-bold text-blue-800 mb-2">印刷版設定</h4><div class="grid grid-cols-2 gap-2"><div><label class="text-xs">印刷成本</label><input name="costPrinted" type="number" value="${p.costPrinted||0}" class="w-full border p-1 rounded text-sm"></div><div><label class="text-xs">印刷售價</label><input name="pricePrinted" type="number" value="${p.pricePrinted||0}" class="w-full border p-1 rounded text-sm"></div><div><label class="text-xs">印刷MOQ</label><input name="moqPrinted" type="number" value="${p.moqPrinted||100}" class="w-full border p-1 rounded text-sm"></div></div></div></div><div><label class="block text-sm">圖片</label><label class="border p-2 rounded w-full block text-center cursor-pointer bg-slate-50 text-slate-500 hover:bg-slate-100 mb-2 text-sm"><input type="file" onchange="window.handleImageUpload(this)" class="hidden">選擇檔案</label><input id="imageUrlInput" name="imageUrl" type="text" value="${p.imageUrl||''}" placeholder="或輸入網址" class="w-full border p-2 rounded mt-1 text-sm"><img id="imagePreview" src="${p.imageUrl||''}" class="h-20 mt-2 object-contain bg-gray-50 ${p.imageUrl?'':'hidden'}"></div><div><label class="block text-sm">供應商</label><input name="supplierName" value="${p.supplierName||''}" required ${supplierReadOnly}></div><div class="grid grid-cols-2 gap-4"><div><label id="nameLabel" class="block text-sm">品名</label><input name="name" value="${p.name||''}" required class="w-full border p-2 rounded"></div><div><label class="block text-sm">規格</label><input name="spec" value="${p.spec||''}" class="w-full border p-2 rounded"></div></div><div class="bg-gray-50 p-3 rounded border"><div class="grid grid-cols-3 gap-3"><div><label class="block text-xs">成本</label><input name="cost" type="number" value="${p.cost||''}" oninput="window.calculatePrice('cost')" required class="w-full border p-1"></div><div><label class="block text-xs">未稅售價</label><input name="price" type="number" value="${p.price||''}" oninput="window.calculatePrice('preTax')" ${priceReadOnly} class="w-full border p-1"></div><div><label class="block text-xs">稅後(或含稅成本)</label><input name="priceAfterTax" type="number" value="${p.priceAfterTax||''}" oninput="window.calculatePrice('postTax')" required class="w-full border p-1 font-bold"></div></div><div id="boxPricePreview"></div></div><div class="grid grid-cols-2 gap-4" id="stockField"><div><label class="block text-sm">庫存</label><input name="stock" type="number" value="${p.stock||0}" required class="w-full border p-2 rounded"></div><div><label class="block text-sm">安全庫存</label><input name="safeStock" type="number" value="${p.safeStock||5}" required class="w-full border p-2 rounded"></div></div><button class="w-full bg-blue-600 text-white p-2 rounded font-bold">儲存</button></form></div></div>`; 
        }
        function renderCartModal() { if(!state.showCartModal)return''; const total=state.cart.reduce((s,i)=>s+i.price*i.qty,0); return `<div class="fixed inset-0 bg-black/50 z-50 flex justify-end" onclick="if(event.target===this)window.updateCartModal(false)"><div class="w-full max-w-md bg-white h-full flex flex-col animate-fade-in mobile-modal"><div class="p-6 border-b flex justify-between"><h3 class="font-bold text-lg">購物車</h3><button onclick="window.updateCartModal(false)">x</button></div><div class="flex-1 overflow-y-auto p-6 mobile-modal-content">${state.cart.map(i=>`<div class="flex gap-4 mb-4 items-center"><div class="w-12 h-12 bg-gray-100 rounded overflow-hidden flex-shrink-0"><img src="${i.imageUrl}" class="w-full h-full object-cover"></div><div class="flex-1"><h4 class="font-bold text-sm line-clamp-2">${i.name}</h4><div class="text-blue-600 text-xs font-bold">${formatMoney(i.price)}</div></div><div><span class="font-bold mx-2">x${i.qty}</span></div></div>`).join('')}</div><div class="p-6 border-t bg-gray-50"><textarea id="orderNoteInput" class="w-full border p-2 mb-4 text-sm" placeholder="備註"></textarea><div class="flex justify-between mb-4"><span class="text-sm">總計</span><span class="text-xl font-bold text-blue-700">${formatMoney(total)}</span></div><button onclick="window.checkout()" class="w-full bg-blue-600 text-white p-3 rounded font-bold">結帳</button></div></div></div>`; }
        function renderPaymentModal() { if(!state.showPaymentModal)return''; return `<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center" onclick="if(event.target===this)window.closePaymentModal()"><div class="bg-white p-6 rounded shadow-lg"><h3 class="font-bold mb-4">入帳確認</h3><form onsubmit="window.confirmPayment(event)"><input name="paymentDate" type="date" required value="${new Date().toISOString().split('T')[0]}" class="border p-2 mb-4 w-full"><button class="w-full bg-blue-600 text-white p-2 rounded">確認</button></form></div></div>`; }
        function renderImagePreviewModal() { if (!state.showImagePreview || !state.previewImageUrl) return ''; return `<div class="fixed inset-0 bg-black/95 z-[70] flex items-center justify-center p-4 animate-fade-in img-preview-overlay" onclick="if(event.target===this)window.closeImagePreview()"><div class="relative w-full h-full flex items-center justify-center"><img src="${state.previewImageUrl}" class="max-w-full max-h-[90vh] object-contain rounded shadow-2xl"><button onclick="window.closeImagePreview()" class="absolute top-4 right-4 bg-white/20 hover:bg-white/40 text-white rounded-full p-2 backdrop-blur-md transition-colors"><i data-lucide="x" class="w-8 h-8"></i></button></div></div>`; }
        function renderExpenseModal() { return state.showExpenseModal ? `<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-sm px-4"><div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6"><div class="flex justify-between mb-4"><h3 class="font-bold text-lg">新增支出</h3><button onclick="window.closeExpenseModal()">x</button></div><form onsubmit="window.saveExpense(event)" class="space-y-4"><input name="title" required placeholder="項目" class="w-full border p-2 rounded"><input name="amount" type="number" required placeholder="金額" class="w-full border p-2 rounded"><input name="date" type="date" required value="${new Date().toISOString().split('T')[0]}" class="w-full border p-2 rounded"><button class="w-full bg-red-600 text-white p-2 rounded">儲存</button></form></div></div>` : ''; }
        function renderExpenses() { return `<div class="p-4 md:p-8 animate-fade-in h-full flex flex-col"><div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold text-gray-800">支出管理</h2><button onclick="window.openExpenseModal()" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 flex items-center shadow-sm"><i data-lucide="plus" class="w-4 h-4 mr-2"></i> 新增支出</button></div><div class="bg-white rounded-xl shadow-sm border border-gray-200 flex-1 overflow-hidden flex flex-col"><div class="overflow-x-auto custom-scrollbar flex-1"><table class="w-full text-left text-sm"><thead class="bg-gray-50 text-gray-500 sticky top-0 z-10"><tr><th class="p-4">日期</th><th class="p-4">項目</th><th class="p-4 text-right">金額</th></tr></thead><tbody class="divide-y divide-gray-100">${state.expenses.map(e=>`<tr class="hover:bg-gray-50"><td class="p-4 font-mono">${e.date}</td><td class="p-4 font-bold">${e.title}</td><td class="p-4 text-right font-bold text-red-600">-${formatMoney(e.amount)}</td></tr>`).join('')}</tbody></table></div></div></div>${renderExpenseModal()}`; }

        function renderApp() {
            const app = document.getElementById('app');
            if (!state.currentUser) { app.innerHTML = renderLogin() + renderRegisterModal(); } 
            else {
                let mainContent = '';
                if (state.currentView === 'dashboard') mainContent = renderDashboard();
                else if (state.currentView === 'products') mainContent = renderProductList();
                else if (state.currentView === 'orders') mainContent = renderOrders();
                else if (state.currentView === 'shop') mainContent = renderShop();
                else if (state.currentView === 'expenses') mainContent = renderExpenses();
                else if (state.currentView === 'users') mainContent = renderUserManagement();
                else if (state.currentView === 'crm') mainContent = renderCRM();
                else if (state.currentView === 'repair_client') mainContent = renderClientRepair();
                else if (state.currentView === 'repair_admin') mainContent = renderAdminRepairs();
                else if (state.currentView === 'repair_history') mainContent = renderAdminRepairHistory();
                else if (state.currentView === 'contact') mainContent = renderContact();

                app.innerHTML = `<div class="flex h-full w-full">${renderSidebar()}<div class="flex-1 bg-slate-50 relative overflow-hidden flex flex-col">${mainContent}</div></div>${renderProductModal()}${renderPaymentModal()}${renderExpenseModal()}${renderRegisterModal()}${renderProfileModal()}${renderCartModal()}${renderImagePreviewModal()}${state.showClientRepairDetail?renderClientRepairDetail():''}${state.showAdminOrderModal?renderAdminOrderModal():''}`;
            }
            lucide.createIcons();
        }

        renderApp();
        
        if (isConfigured) {
            onAuthStateChanged(auth, u => { if(u) initDataListeners(); });
        }
    </script>
</body>
</html>
