<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>羅德精技醫材訂貨系統 (Ver 5.9 UI優化+LINE Messaging API版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Mobile Layout Fixes: Lock body, scroll inside app */
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #f8fafc; 
            -webkit-tap-highlight-color: transparent;
            height: 100dvh; 
            width: 100vw;
            overflow: hidden; /* Prevent body scroll */
            position: fixed; /* Lock viewport */
            inset: 0;
        }
        
        .font-serif { font-family: 'Noto Serif TC', serif; }
        .logo-font { font-family: 'Noto Serif TC', serif; font-weight: 900; }
        
        input, select, textarea { font-size: 16px !important; } 
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
        
        /* Custom Scrollbar */
        .custom-scrollbar {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* Smooth mobile scroll */
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        /* Grid Layouts */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; padding-bottom: 80px; }
        @media (min-width: 640px) { .product-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; } }
        @media (min-width: 1024px) { .product-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; } }
        
        .category-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; padding-bottom: 80px; }
        @media (min-width: 640px) { .category-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .category-grid { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); } }
        
        .product-card { transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:active { transform: scale(0.98); }
        @media (min-width: 768px) { .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.1); } }
        
        /* Optimized Image Container for Shop */
        .img-container { 
            width: 100%; 
            height: 120px; /* Reduced height */
            background-color: #f1f5f9; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            border-radius: 0.75rem; 
            position: relative; 
            cursor: zoom-in;
        }
        .img-container img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
        
        .category-card-elegant {
            background: white; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; height: 140px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; position: relative; overflow: hidden;
        }
        @media (min-width: 768px) { .category-card-elegant { height: 180px; padding: 24px; } }
        .cat-icon-bg { position: absolute; right: -10px; bottom: -10px; opacity: 0.08; transform: rotate(-15deg); width: 80px; height: 80px; }
        
        /* Mobile Modal */
        @media (max-width: 640px) {
            .mobile-modal { width: 100% !important; height: 100% !important; max-height: 100% !important; border-radius: 0 !important; display: flex; flex-direction: column; }
            .mobile-modal-content { flex: 1; overflow-y: auto; }
        }
        .img-preview-overlay { background-color: rgba(0, 0, 0, 0.9); }
        
        .bg-elegant { background: radial-gradient(circle at top right, #f8fafc, #eff6ff); }
        .btn-noble { background: linear-gradient(to right, #2c3e50, #4ca1af); box-shadow: 0 4px 15px rgba(44, 62, 80, 0.3); }
        .text-gold { color: #b78628; }
        
        .logo-text-zh { color: #255a9e; } 
        .logo-text-en { color: #255a9e; }
        .logo-divider { background-color: #255a9e; }

        .no-spinner::-webkit-inner-spin-button, 
        .no-spinner::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .no-spinner { -moz-appearance: textfield; }

        .login-bg-pattern {
            background-color: #f0f9ff;
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 90, 158, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(37, 90, 158, 0.05) 0px, transparent 50%);
        }
        .circle-icon-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; height: 300px; border-radius: 50%; border: 1px dashed rgba(255, 255, 255, 0.3);
        }
        .orbit-icon {
            position: absolute; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(4px); border-radius: 50%; padding: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); color: white; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.2);
        }
        .pos-1 { top: 0; left: 50%; transform: translate(-50%, -50%); }
        .pos-2 { top: 15%; left: 85%; transform: translate(-50%, -50%); }
        .pos-3 { top: 50%; left: 100%; transform: translate(-50%, -50%); }
        .pos-4 { top: 85%; left: 85%; transform: translate(-50%, -50%); }
        .pos-5 { top: 100%; left: 50%; transform: translate(-50%, -50%); }
        .pos-6 { top: 85%; left: 15%; transform: translate(-50%, -50%); }
        .pos-7 { top: 50%; left: 0%; transform: translate(-50%, -50%); }
        .pos-8 { top: 15%; left: 15%; transform: translate(-50%, -50%); }
    </style>
</head>
<body class="text-slate-800">

    <div id="app" class="h-full w-full flex flex-col relative overflow-hidden"></div>
    <div id="message-container" class="fixed top-4 right-4 left-4 md:left-auto md:w-96 z-[100] pointer-events-none"></div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, where, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- LINE MESSAGING API CONFIGURATION ---
        // 請填入您的後端服務網址 (如 Google Apps Script 網頁應用程式網址或 Firebase Functions)
        // 注意：前端無法直接呼叫 LINE API，必須透過後端轉發以保護 Access Token
        const LINE_API_URL = ""; 

        // 您的 LINE 官方帳號連結 (用於聯絡我們按鈕)，例如 https://lin.ee/xxxxxx
        const LINE_OA_LINK = "https://line.me/ti/p/~d9365003"; 

        const LOCAL_FIREBASE_CONFIG = {
            apiKey: "AIzaSyCnGvyHtX7BADHQOoCsimWjT191YEgaoJs",
            authDomain: "roadbiomed-28961.firebaseapp.com",
            projectId: "roadbiomed-28961",
            storageBucket: "roadbiomed-28961.firebasestorage.app",
            messagingSenderId: "898023786208",
            appId: "1:898023786208:web:ce4e3b605f4b8f159eb285",
            measurementId: "G-CLG0WM8T3P"
        };

        let firebaseConfig, app, auth, db, isConfigured = false, appId = 'road-v1';

        try {
            if (LOCAL_FIREBASE_CONFIG && LOCAL_FIREBASE_CONFIG.apiKey) { 
                firebaseConfig = LOCAL_FIREBASE_CONFIG; isConfigured = true; 
            } else if (typeof __firebase_config !== 'undefined' && __firebase_config) { 
                firebaseConfig = JSON.parse(__firebase_config); appId = typeof __app_id !== 'undefined' ? __app_id : appId; isConfigured = true; 
            }

            if (isConfigured) {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
            }
        } catch (e) { console.error("Firebase Init Error", e); }

        const TAIWAN_CITIES = [
            "台北市", "新北市", "桃園市", "台中市", "台南市", "高雄市", "基隆市", "新竹市", "嘉義市", 
            "新竹縣", "苗栗縣", "彰化縣", "南投縣", "雲林縣", "嘉義縣", "屏東縣", "宜蘭縣", "花蓮縣", "台東縣", 
            "澎湖縣", "金門縣", "連江縣"
        ];
        
        const CAT_MAP = {
            'machine': '包藥機',
            'paper': '包藥紙卷',
            'medicine_bag': '夾鍊藥袋',
            'parts': '零件',
            'other': '其他'
        };

        const EXPENSE_CATS = {
            'restock': '進貨成本',
            'logistics': '物流運費',
            'transport': '交通費用',
            'office': '辦公雜支',
            'salary': '人事薪資',
            'rent': '房租水電',
            'marketing': '行銷廣告',
            'other': '其他支出'
        };

        // --- State ---
        const state = {
            users: [], currentUser: null, currentView: 'login', loginMode: 'select',
            products: [], orders: [], expenses: [], repairs: [],
            isLoading: false, 
            viewHistory: [],
            productNav: { view: 'category', category: null, supplier: null }, 
            showProductModal: false, showPaymentModal: false, showExpenseModal: false,
            showRegisterModal: false, showProfileModal: false, showRepairModal: false, showRepairProcessModal: false, 
            showClientRepairDetail: false, showAdminOrderModal: false, showClientHistoryModal: false,
            showShipmentModal: false, showOrderEditModal: false, showHistoryModal: false,
            showOrderConfirmModal: false, pendingOrderData: null, showForgotModal: false,
            activeShipmentOrder: null, activeEditingOrder: null, 
            registerRole: 'client',
            showImagePreview: false, previewImageUrl: null,
            activePaymentOrderDocId: null, activeRepairId: null, editingProduct: null, editingExpense: null,
            activeCategory: null, activeCity: null, activeClientRepair: null,
            activeHistoryClient: null, activeHistorySupplier: null, historyViewType: 'client',
            historyTab: 'orders', 
            dashboardView: 'main',
            crmView: 'type', crmType: 'client', crmSearch: '',
            orderFilter: 'all', orderSearch: '',
            adminOrderDraft: { clientId: '', items: [] },
            adminOrderFilters: { clientCity: '', clientSearch: '', prodCategory: '', prodSupplier: '', prodId: '' },
            repairAdminTab: 'pending' 
        };

        // --- Helpers ---
        const formatMoney = (n) => new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', minimumFractionDigits: n % 1 === 0 ? 0 : 2 }).format(n);
        const generateOrderId = () => {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hour = String(now.getHours()).padStart(2, '0');
            const minute = String(now.getMinutes()).padStart(2, '0');
            const second = String(now.getSeconds()).padStart(2, '0');
            return `ORD-${year}${month}${day}-${hour}${minute}${second}`;
        };
        const showToast = (msg, type = 'success') => {
            const container = document.getElementById('message-container');
            const el = document.createElement('div');
            el.className = `flex items-center p-4 mb-3 rounded-xl shadow-lg border-l-4 animate-fade-in bg-white ${type==='success'?'border-emerald-500 text-emerald-800':'border-red-500 text-red-800'}`;
            el.innerHTML = `<i data-lucide="${type==='success'?'check-circle':'alert-circle'}" class="w-5 h-5 mr-3 flex-shrink-0"></i><span class="font-medium text-sm">${msg}</span>`;
            container.appendChild(el); lucide.createIcons(); setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2500);
        };
        
        const getUnitLabel = (category) => {
            if (category === 'machine') return '台';
            if (category === 'paper') return '箱';
            return '個';
        };

        const sendBackendNotification = async (payload) => {
            if (!LINE_API_URL) return; 
            try {
                // 將資料發送給後端 (GAS)，後端再負責組成 LINE Flex Message 透過 Messaging API 發送
                await fetch(LINE_API_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Google Apps Script Web App 常用設定，如果是標準後端請移除
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                console.log("Messaging API Payload sent to backend:", payload.type);
            } catch (error) {
                console.error("Failed to send backend notification:", error);
            }
        };

        // --- Partial Refresh & Search Logic ---
        window.handleOrderSearch = (val) => {
            state.orderSearch = val;
            window.refreshOrderListUI();
        };

        window.refreshOrderListUI = () => {
            const tbody = document.getElementById('orderListBody');
            if (tbody) {
                tbody.innerHTML = window.generateOrderRows();
                lucide.createIcons();
            }
        };

        window.generateOrderRows = () => {
            const isAdmin = state.currentUser.role === 'admin';
            const isSupplier = state.currentUser.role === 'supplier';
            
            let orders = [];
            if (isAdmin) {
                orders = state.orders;
            } else if (isSupplier) {
                orders = state.orders.filter(o => o.items.some(i => (i.supplierName || '自有') === state.currentUser.name));
            } else {
                orders = state.orders.filter(o => o.clientId === state.currentUser.username);
            }
            
            if ((isAdmin || isSupplier) && state.orderFilter !== 'all') {
                if(state.orderFilter === 'pending') orders = orders.filter(o => o.status === 'pending');
                else if(state.orderFilter === 'unpaid') orders = orders.filter(o => o.paymentStatus === 'unpaid');
            }
            
            if (state.orderSearch) {
                const term = state.orderSearch.toLowerCase();
                orders = orders.filter(o => o.id.toLowerCase().includes(term) || o.clientName.toLowerCase().includes(term) || o.items.some(i => i.name.toLowerCase().includes(term) || (i.category && CAT_MAP[i.category] && CAT_MAP[i.category].includes(term)) || (i.supplierName && i.supplierName.toLowerCase().includes(term))));
            }

            if (orders.length === 0) return `<tr><td colspan="${(isAdmin || isSupplier) ? 9 : 8}" class="p-8 text-center text-slate-400">沒有符合的訂單</td></tr>`;

            return orders.map(o => { 
                const firstItem = o.items[0]; 
                const product = state.products.find(p => p.id === firstItem.productId.replace('_printed','')); 
                const category = firstItem.category ? CAT_MAP[firstItem.category] : (product ? CAT_MAP[product.category] : '-'); 
                const spec = firstItem.spec || (product ? (product.spec||product.name) : firstItem.name); 
                const isPending = o.status === 'pending';
                let paperNote = '';
                if (isAdmin && o.items.some(i => i.category === 'paper')) {
                    const client = state.users.find(u => u.username === o.clientId);
                    if (client && client.paperSpecNote) {
                        paperNote = `<div class="text-[10px] text-blue-600 bg-blue-50 border border-blue-100 rounded px-1.5 py-0.5 mt-1 inline-block"><i data-lucide="info" class="w-3 h-3 inline mr-0.5"></i>規格: ${client.paperSpecNote}</div>`;
                    }
                }
                
                let actionHtml = '';
                if (isAdmin) {
                    actionHtml = (o.status !== 'completed' ? `<button onclick="window.openShipmentModal('${o.docId}')" class="bg-slate-800 text-white px-3 py-1.5 rounded text-xs hover:bg-slate-900 shadow font-bold">出貨</button>` : `<button onclick="window.revertShipment(event, '${o.docId}')" class="bg-gray-200 text-gray-600 px-3 py-1.5 rounded text-xs hover:bg-gray-300 font-bold">取消出貨</button>`) + 
                                 (o.paymentStatus !== 'paid' ? `<button onclick="window.openPaymentModal('${o.docId}')" class="bg-blue-600 text-white px-3 py-1.5 rounded text-xs hover:bg-blue-700 shadow font-bold">入帳</button>` : `<button onclick="window.revertPayment(event, '${o.docId}')" class="bg-gray-200 text-gray-600 px-3 py-1.5 rounded text-xs hover:bg-gray-300 font-bold">取消入帳</button>`) + 
                                 `<button onclick="window.deleteOrder(event, '${o.docId}')" class="bg-red-50 text-red-600 px-2 py-1.5 rounded hover:bg-red-100 border border-red-200" title="刪除訂單"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`;
                } else if (isSupplier) {
                    actionHtml = (o.status !== 'completed' ? `<button onclick="window.openShipmentModal('${o.docId}')" class="bg-slate-800 text-white px-3 py-1.5 rounded text-xs hover:bg-slate-900 shadow font-bold">出貨</button>` : `<button onclick="window.revertShipment(event, '${o.docId}')" class="bg-gray-200 text-gray-600 px-3 py-1.5 rounded text-xs hover:bg-gray-300 font-bold">取消出貨</button>`);
                } else {
                    actionHtml = isPending ? `<button onclick="window.openOrderEditModal(event, '${o.id}')" class="text-blue-600 hover:bg-blue-50 bg-blue-50/50 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors" title="修改訂單"><i data-lucide="edit-2" class="w-3 h-3 inline mr-1"></i>修改</button><button onclick="window.deleteOrder(event, '${o.docId}')" class="text-red-600 hover:bg-red-50 bg-red-50/50 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors" title="取消訂單"><i data-lucide="trash-2" class="w-3 h-3 inline mr-1"></i>取消</button>` : `<span class="text-xs text-slate-400 bg-slate-100 px-2 py-1 rounded">已鎖定</span>`;
                }
                
                // Mobile optimized card layout returning as TR
                return `<tr class="hover:bg-slate-50 group cursor-pointer block md:table-row bg-white md:bg-transparent border border-slate-200 md:border-none rounded-xl md:rounded-none mb-3 md:mb-0 p-3 md:p-0 shadow-sm md:shadow-none mx-2 md:mx-0" onclick="${isAdmin || isSupplier || isPending ? `window.openOrderEditModal(event, '${o.id}')` : ''}">
                    <td class="block md:table-cell p-0 md:p-4 border-none md:border-b border-slate-100">
                        <!-- Mobile Layout -->
                        <div class="md:hidden flex flex-col gap-2">
                            <div class="flex justify-between items-center border-b border-dashed border-slate-200 pb-2">
                                <span class="font-mono text-slate-500 text-[11px]">${o.id}</span>
                                <span class="text-[11px] text-slate-400">${o.date}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <div class="flex gap-2">
                                    <span class="px-2 py-0.5 rounded text-[10px] font-bold ${o.status==='completed'?'bg-emerald-100 text-emerald-700':'bg-yellow-100 text-yellow-700'}">${o.status==='completed'?'已出貨':'待出貨'}</span>
                                    <span class="px-2 py-0.5 rounded text-[10px] font-bold ${o.paymentStatus==='paid'?'bg-blue-100 text-blue-700':'bg-red-100 text-red-700'}">${o.paymentStatus==='paid'?'已付款':'未付款'}</span>
                                </div>
                                ${(isAdmin || isSupplier) ? `<span class="font-bold text-slate-800 text-sm">${o.clientName}</span>` : ''}
                            </div>
                            <div class="bg-slate-50 rounded-lg p-3 text-sm border border-slate-100">
                                <div class="font-bold text-slate-700 mb-1 flex justify-between">
                                    <span>${category}</span>
                                    <span class="text-xs text-slate-500 font-normal truncate max-w-[150px]">${spec}</span>
                                </div>
                                ${o.items.length>1?`<div class="text-[11px] text-slate-500 mt-1 flex items-center"><i data-lucide="layers" class="w-3 h-3 mr-1"></i> 包含 ${o.items.length} 項商品</div>`:''}
                                ${o.orderNote ? `<div class="text-[11px] text-orange-500 mt-1.5 flex items-start"><i data-lucide="message-square" class="w-3 h-3 mr-1 mt-0.5 shrink-0"></i><span class="leading-tight">${o.orderNote}</span></div>` : ''}
                                ${paperNote ? `<div class="mt-1">${paperNote}</div>` : ''}
                            </div>
                            <div class="flex justify-between items-center pt-2">
                                <div class="flex gap-2" onclick="event.stopPropagation()">${actionHtml}</div>
                                <span class="font-black text-blue-600 text-lg">${formatMoney(o.totalAmount)}</span>
                            </div>
                        </div>
                        <!-- Desktop Layout ID -->
                        <div class="hidden md:block font-mono text-slate-500 text-xs">${o.id}</div>
                    </td>
                    <td class="hidden md:table-cell p-4 text-slate-500">${o.date}</td>
                    ${(isAdmin || isSupplier) ? `<td class="hidden md:table-cell p-4 font-bold text-slate-800">${o.clientName}</td>` : ''}
                    <td class="hidden md:table-cell p-4 text-slate-600 font-medium">${category}</td>
                    <td class="hidden md:table-cell p-4 text-slate-600">
                        <div class="truncate max-w-[150px]">${spec}</div>${o.items.length>1?` <span class="text-xs bg-gray-100 rounded px-1">+${o.items.length-1}</span>`:''}
                        ${o.orderNote ? `<div class="text-xs text-orange-500 mt-1"><i data-lucide="message-square" class="w-3 h-3 inline mr-1"></i>${o.orderNote}</div>` : ''}
                        ${paperNote}
                    </td>
                    <td class="hidden md:table-cell p-4 text-right font-bold text-slate-700">${formatMoney(o.totalAmount)}</td>
                    <td class="hidden md:table-cell p-4 text-center"><span class="px-2 py-1 rounded text-xs font-bold ${o.status==='completed'?'bg-emerald-100 text-emerald-700':'bg-yellow-100 text-yellow-700'}">${o.status==='completed'?'已出貨':'待出貨'}</span></td>
                    <td class="hidden md:table-cell p-4 text-center"><span class="px-2 py-1 rounded text-xs font-bold ${o.paymentStatus==='paid'?'bg-blue-100 text-blue-700':'bg-red-100 text-red-700'}">${o.paymentStatus==='paid'?'已付款':'未付款'}</span></td>
                    <td class="hidden md:table-cell p-4 text-center" onclick="event.stopPropagation()"><div class="flex items-center justify-center gap-2">${actionHtml}</div></td>
                </tr>`; 
            }).join('');
        };

        window.handleCRMSearch = (val) => { state.crmSearch = val; window.refreshCRMListUI(); };
        window.refreshCRMListUI = () => { const tbody = document.getElementById('crmListBody'); if (tbody) { tbody.innerHTML = window.generateCRMRows(); lucide.createIcons(); } };
        window.generateCRMRows = () => {
            if (state.crmType === 'supplier') {

        window.toggleOrderInvoice = (idx) => {
            if (!state.activeEditingOrder) return;
            const items = [...state.activeEditingOrder.items]; const item = items[idx]; const rawId = item.productId.split('_')[0]; const product = state.products.find(p => p.id === rawId);
            if (product) {
                item.hasInvoice = !item.hasInvoice;
                let isPrinted = item.productId.includes('_printed');
                let basePrice = isPrinted ? (product.pricePrinted || product.price) : product.price;
                let rollsPerBox = (product.category === 'paper' && product.rollsPerBox > 0) ? product.rollsPerBox : 1;
                if (product.category === 'paper') { basePrice = basePrice * rollsPerBox; }
                if (item.hasInvoice) { item.price = basePrice * 1.05; } else { item.price = basePrice; }
                if (item.hasInvoice && !item.name.includes('[含稅]')) item.name += ' [含稅]';

        window.updateOrderQty = (index, delta) => {
            if (!state.activeEditingOrder) return;
            const items = [...state.activeEditingOrder.items]; const item = items[index]; const rawId = item.productId.split('_')[0]; const product = state.products.find(p => p.id === rawId); let minQty = 1;
            if (product) {
                 minQty = product.minOrderQty || 1;
                 if (product.category === 'paper') {
                    let isPrinted = item.productId.includes('_printed');
                    let rollsPerBox = (product.rollsPerBox > 0) ? product.rollsPerBox : 1;
                    let minRolls = isPrinted ? ((product.paperSpec === '7cm_folded') ? 100 : 60) : ((product.paperSpec === '7cm_folded') ? 20 : 8);
                    minQty = Math.ceil(minRolls / rollsPerBox);
                 }
            }
            let newQty = item.qty + delta;
            if (newQty < minQty) { showToast(`不能低於最低採購量: ${minQty}`, 'error'); newQty = minQty; }
            item.qty = newQty;

        };
        window.updateShopCard = (id) => {
            const p = state.products.find(x => x.id === id); if (!p) return;
            const elQty = document.getElementById(`qty-${id}`); 
            const elPrint = document.getElementById(`print-${id}`); 
            const elInvoice = document.getElementById(`invoice-${id}`); 
            const elPrice = document.getElementById(`price-${id}`); 
            const elMoq = document.getElementById(`moq-${id}`); 
            const elHint = document.getElementById(`hint-${id}`);
            
            // New machine options
            const elPowder = document.getElementById(`powder-${id}`);
            const elGrid = document.getElementById(`grid-${id}`);
            
            let isPaper = p.category === 'paper'; 
            let rollsPerBox = (isPaper && p.rollsPerBox > 0) ? p.rollsPerBox : 1; 
            let unitPrice = p.price; 
            let isPrinted = elPrint && elPrint.checked;
            
            if (isPaper && isPrinted) unitPrice = p.pricePrinted || p.price; 
            
            // Add machine options price to unit price
            if (elPowder && elPowder.checked) unitPrice += (p.pricePowder || 0);
            if (elGrid && elGrid.checked) unitPrice += (p.priceGrid || 0);

            let hasInvoice = elInvoice && elInvoice.checked; if (hasInvoice) unitPrice = unitPrice * 1.05;
            let displayPrice = unitPrice; let unitLabel = isPaper ? "箱" : (p.category === 'machine' ? "台" : "個");
            if (isPaper) { displayPrice = unitPrice * rollsPerBox; }
            if (elPrice) elPrice.innerText = formatMoney(displayPrice);
            
            let minQty = p.minOrderQty || 1;
            if (isPaper) { 
                let minRolls = isPrinted ? ((p.paperSpec === '7cm_folded') ? 100 : 60) : ((p.paperSpec === '7cm_folded') ? 20 : 8); 
                minQty = Math.ceil(minRolls / rollsPerBox); 
            }
            
            if (elMoq) {
                if (isPaper && isPrinted) {
                    elMoq.style.display = 'none';
                } else {
                    elMoq.style.display = 'inline-block';
                    elMoq.innerText = `最低: ${minQty} ${unitLabel}`;
                }
            }
            
            if (elQty) { 
                const wasPrinted = elQty.dataset.wasPrinted === 'true';
                if (wasPrinted && !isPrinted) {
                    elQty.value = minQty;
                }
                elQty.dataset.wasPrinted = isPrinted;

                elQty.min = minQty; 
                if (parseFloat(elQty.value) < minQty) elQty.value = minQty; 
            }

            } else if (state.dashboardView === 'profit_all') {

                </div>
            </div>

            <div><label class="block text-sm">圖片</label><label class="border p-2 rounded w-full block text-center cursor-pointer bg-slate-50 text-slate-500 hover:bg-slate-100 mb-2 text-sm"><input type="file" onchange="window.handleImageUpload(this)" class="hidden">選擇檔案</label><input id="imageUrlInput" name="imageUrl" type="text" value="${p.imageUrl||''}" placeholder="或輸入網址" class="w-full border p-2 rounded mt-1 text-sm"><img id="imagePreview" src="${p.imageUrl||''}" class="h-20 mt-2 object-contain bg-gray-50 ${p.imageUrl?'':'hidden'}"></div><div><label class="block text-sm">供應商</label><input name="supplierName" value="${p.supplierName||''}" required ${supplierReadOnly}></div><div class="grid grid-cols-2 gap-4"><div><label id="nameLabel" class="block text-sm">品名</label><input name="name" value="${p.name||''}" required class="w-full border p-2 rounded"></div><div><label class="block text-sm">規格</label><input name="spec" value="${p.spec||''}" class="w-full border p-2 rounded"></div></div><div class="bg-gray-50 p-3 rounded border"><div class="grid grid-cols-3 gap-3">${isSupplier ? `<div class="col-span-1"><label class="block text-xs">出廠成本(未稅)</label><input name="factoryCost" type="number" step="0.01" value="${p.cost ? (p.cost/1.05).toFixed(2) : ''}" oninput="window.calculatePrice('factoryCost')" required class="w-full border p-1"></div><div class="col-span-2"><label class="block text-xs">稅後成本(自動計算)</label><input id="supplierPostTaxDisplay" type="number" value="${p.cost||''}" readonly class="w-full border p-1 bg-gray-100 text-gray-500"></div><input type="hidden" name="cost" id="supplierCostHidden" value="${p.cost||0}"><input type="hidden" name="price" value="${p.price||0}"><input type="hidden" name="priceAfterTax" id="supplierPriceAfterHidden" value="${p.priceAfterTax||0}">` : `<div><label class="block text-xs">進貨成本</label><input name="cost" type="number" step="0.01" value="${p.cost||''}" required class="w-full border p-1"></div><div><label class="block text-xs">未稅售價</label><input name="price" type="number" step="0.01" value="${p.price||''}" oninput="window.calculatePrice('preTax')" ${priceReadOnly} class="w-full border p-1"></div><div><label class="block text-xs">稅後售價</label><input name="priceAfterTax" type="number" step="0.01" value="${p.priceAfterTax||''}" oninput="window.calculatePrice('postTax')" required class="w-full border p-1 font-bold"></div>`}</div><div id="boxPricePreview"></div></div><div class="grid grid-cols-2 gap-4" id="stockField"><div><label class="block text-sm">庫存</label><input name="stock" type="number" value="${p.stock||0}" required class="w-full border p-2 rounded"></div><div><label class="block text-sm">安全庫存</label><input name="safeStock" type="number" value="${p.safeStock||5}" required class="w-full border p-2 rounded"></div></div><button class="w-full bg-blue-600 text-white p-2 rounded font-bold">儲存</button></form></div></div>`; 
        }

        function renderExpenseModal() {
            if(!state.showExpenseModal) return '';
            const e = state.editingExpense || { date: new Date().toISOString().split('T')[0] };
            return `<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 animate-fade-in">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-lg text-slate-800">支出紀錄</h3>
                        <button type="button" onclick="window.closeExpenseModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <form onsubmit="window.saveExpense(event)" class="space-y-3">
                        <div><label class="block text-xs font-bold text-slate-600 mb-1">項目名稱</label><input name="title" value="${e.title||''}" required class="w-full border border-slate-300 p-2 rounded-lg outline-none focus:border-blue-500"></div>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="block text-xs font-bold text-slate-600 mb-1">金額</label><input name="amount" type="number" value="${e.amount||''}" required class="w-full border border-slate-300 p-2 rounded-lg outline-none focus:border-blue-500"></div>
                            <div><label class="block text-xs font-bold text-slate-600 mb-1">日期</label><input name="date" type="date" value="${e.date||''}" required class="w-full border border-slate-300 p-2 rounded-lg outline-none focus:border-blue-500"></div>
                        </div>
                        <div><label class="block text-xs font-bold text-slate-600 mb-1">類別</label>
                        <select name="category" id="expenseCategorySelect" onchange="window.handleExpenseCatChange(this)" class="w-full border border-slate-300 p-2 rounded-lg outline-none bg-white">
                            ${Object.keys(EXPENSE_CATS).map(k => `<option value="${k}" ${e.category===k?'selected':''}>${EXPENSE_CATS[k]}</option>`).join('')}
                        </select></div>
                        <div><label class="block text-xs font-bold text-slate-600 mb-1">收款人 / 廠商</label><input name="payee" id="payeeInput" value="${e.payee||''}" class="w-full border border-slate-300 p-2 rounded-lg outline-none focus:border-blue-500"></div>
                        <div><label class="block text-xs font-bold text-slate-600 mb-1">單據 / 發票號碼</label><input name="receiptNo" value="${e.receiptNo||''}" class="w-full border border-slate-300 p-2 rounded-lg outline-none focus:border-blue-500"></div>
                        <div><label class="block text-xs font-bold text-slate-600 mb-1">備註</label><textarea name="note" rows="2" class="w-full border border-slate-300 p-2 rounded-lg outline-none focus:border-blue-500">${e.note||''}</textarea></div>
                        <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold shadow-md hover:bg-blue-700 mt-2 transition-colors">儲存紀錄</button>
                    </form>
                </div>
            </div>`;
        }

        function renderShipmentModal() {
            if(!state.showShipmentModal) return '';
            const o = state.activeShipmentOrder;
            if(!o) return '';
            return `<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 animate-fade-in">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-lg text-slate-800">出貨確認</h3>
                        <button onclick="window.closeShipmentModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <form onsubmit="window.confirmShipment(event)" class="space-y-4">
                        <p class="text-sm text-slate-600 bg-slate-50 p-3 rounded border border-slate-100">
                            正在為訂單 <span class="font-bold text-slate-800">${o.id}</span> 執行出貨
                        </p>
                        <div class="border-t border-b border-slate-100 py-3 space-y-3">
                            <label class="flex items-center text-sm font-bold text-slate-700 cursor-pointer">
                                <input type="checkbox" name="createExpense" class="mr-2" onchange="document.getElementById('logisticsFeeInput').classList.toggle('hidden', !this.checked)">
                                紀錄物流費用支出
                            </label>
                            <input type="number" id="logisticsFeeInput" name="logisticsFee" class="w-full border border-slate-300 rounded p-2 hidden text-sm" placeholder="請輸入運費金額">
                        </div>
                        <button type="submit" class="w-full bg-slate-800 text-white py-3 rounded-lg font-bold shadow-lg hover:bg-slate-900 flex justify-center items-center">
                            <i data-lucide="truck" class="w-4 h-4 mr-2"></i> 確認出貨
                        </button>
                    </form>
                </div>
            </div>`;
        }

        function renderImagePreviewModal() {
            if (!state.showImagePreview || !state.previewImageUrl) return '';
            return `<div class="fixed inset-0 z-[60] img-preview-overlay flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" onclick="window.closeImagePreview()">
                <div class="relative max-w-full max-h-full" onclick="event.stopPropagation()">
                    <button onclick="window.closeImagePreview()" class="absolute -top-12 right-0 text-white hover:text-gray-300 transition-colors p-2">
                        <i data-lucide="x" class="w-8 h-8"></i>
                    </button>
                    <img src="${state.previewImageUrl}" class="max-w-full max-h-[85vh] rounded-lg shadow-2xl object-contain bg-white">
                </div>
            </div>`;
        }

        function renderClientRepairDetail() {
            if (!state.showClientRepairDetail || !state.activeClientRepair) return '';
            const r = state.activeClientRepair;
            const partsList = (r.parts && r.parts.length > 0) ? r.parts.map(p => `<div class="flex justify-between text-xs py-1 border-b border-dashed border-slate-100"><span>${p.name} x${p.qty}</span><span>${formatMoney(p.price * p.qty)}</span></div>`).join('') : '<div class="text-xs text-slate-400 italic">無更換零件</div>';
            
            return `<div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in">
                    <div class="p-5 border-b bg-slate-50 flex justify-between items-center">
                        <h3 class="font-bold text-lg text-slate-800">維修詳情</h3>
                        <button onclick="window.closeModal('ClientRepairDetail')" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-6 h-6"></i></button>
                    </div>
                    <div class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-500">日期: <span class="font-mono text-slate-700">${r.date}</span></span>
                            <span class="px-2 py-1 rounded text-xs font-bold ${r.status==='completed'?'bg-emerald-100 text-emerald-700':(r.status==='processing'?'bg-blue-100 text-blue-700':'bg-orange-100 text-orange-700')}">${r.status==='completed'?'已完修':(r.status==='processing'?'維修中':'待處理')}</span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-100">
                            <div class="text-xs font-bold text-slate-500 mb-1">問題描述</div>
                            <p class="text-sm text-slate-800">${r.issue}</p>
                        </div>
                        ${r.imageUrl ? `<div class="cursor-pointer group relative rounded-lg overflow-hidden border border-slate-200" onclick="window.openImagePreview('${r.imageUrl}')"><img src="${r.imageUrl}" class="w-full h-40 object-cover"><div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white"><i data-lucide="zoom-in" class="w-8 h-8"></i></div></div>` : ''}
                        
                        ${r.diagnosis ? `<div class="bg-blue-50 p-3 rounded-lg border border-blue-100"><div class="text-xs font-bold text-blue-500 mb-1">技師診斷</div><p class="text-sm text-blue-900">${r.diagnosis}</p></div>` : ''}

                        <div class="border-t border-slate-100 pt-3">
                             <div class="text-xs font-bold text-slate-500 mb-2">費用明細</div>
                             <div class="bg-slate-50 rounded p-2 mb-2">
                                 ${partsList}
                             </div>
                             ${r.laborCost > 0 ? `<div class="flex justify-between text-xs py-1 px-2"><span>維修工資</span><span>${formatMoney(r.laborCost)}</span></div>` : ''}
                             ${r.transportFee > 0 ? `<div class="flex justify-between text-xs py-1 px-2"><span>交通費</span><span>${formatMoney(r.transportFee)}</span></div>` : ''}
                             <div class="flex justify-between items-center mt-2 pt-2 border-t border-slate-200">
                                 <span class="font-bold text-slate-700">總計</span>
                                 <span class="font-black text-xl text-red-600">${formatMoney(r.cost)}</span>
                             </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderApp() {
            const app = document.getElementById('app');
            if(!app) return;
            
            // Save cursor position if typing
            const focusedId = document.activeElement ? document.activeElement.id : null;
            const cursorPosition = (document.activeElement && (document.activeElement.type === 'text' || document.activeElement.type === 'search')) ? document.activeElement.selectionStart : undefined;

            if (!state.currentUser) {
                app.innerHTML = renderLogin() + renderForgotModal() + renderRegisterModal();
            } else {
                let mainContent = '';
                if(state.currentView === 'dashboard') mainContent = renderDashboard();
                else if(state.currentView === 'shop') mainContent = renderShop();
                else if(state.currentView === 'products') mainContent = renderProductList();
                else if(state.currentView === 'orders') mainContent = renderOrders();
                else if(state.currentView === 'expenses') mainContent = renderExpenses();
                else if(state.currentView === 'users') mainContent = renderUserManagement();
                else if(state.currentView === 'repair_client') mainContent = renderClientRepair();
                else if(state.currentView === 'repair_admin') mainContent = renderAdminRepairs();
                else if(state.currentView === 'crm') mainContent = `
                    <div class="p-4 md:p-8 animate-fade-in h-full flex flex-col pt-20 md:pt-8">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold text-slate-800">聯絡資訊 (CRM)</h2>
                        </div>
                        <div class="bg-white p-1 rounded-lg border border-slate-200 shadow-sm flex mb-4 max-w-md">
                            <button onclick="window.setCRMView('list', 'client')" class="flex-1 py-2 px-4 rounded-md text-sm font-bold transition-all ${state.crmType==='client'?'bg-slate-800 text-white':'text-slate-500 hover:bg-slate-50'}">診所 / 藥局</button>
                            <button onclick="window.setCRMView('list', 'supplier')" class="flex-1 py-2 px-4 rounded-md text-sm font-bold transition-all ${state.crmType==='supplier'?'bg-slate-800 text-white':'text-slate-500 hover:bg-slate-50'}">供應商</button>
                        </div>
                        <div class="mb-4">
                            <input id="crmSearchInput" type="text" oninput="window.handleCRMSearch(this.value)" value="${state.crmSearch}" placeholder="搜尋名稱或電話..." class="w-full md:max-w-md border border-slate-300 rounded-lg px-4 py-2 text-sm shadow-sm focus:border-blue-500 outline-none transition-colors">
                        </div>
                        ${state.crmType === 'client' && !state.crmSearch ? `<div class="flex gap-2 overflow-x-auto pb-2 mb-2 custom-scrollbar"><button onclick="window.setCRMView('list','client',undefined)" class="whitespace-nowrap px-3 py-1 rounded-full text-xs font-bold border ${state.activeCity===undefined?'bg-blue-600 text-white border-blue-600':'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}">全部</button>${TAIWAN_CITIES.map(c=>`<button onclick="window.setCRMView('list','client','${c}')" class="whitespace-nowrap px-3 py-1 rounded-full text-xs font-bold border ${state.activeCity===c?'bg-blue-600 text-white border-blue-600':'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}">${c}</button>`).join('')}</div>` : ''}
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 overflow-hidden flex flex-col">
                            <div class="overflow-x-auto custom-scrollbar flex-1">
                                <table class="w-full text-left text-sm">
                                    <thead class="bg-slate-50 text-slate-600 sticky top-0 z-10 border-b border-slate-200">
                                        <tr><th class="p-4">名稱</th>${state.crmType==='client'?'<th class="p-4">類型</th>':''}<th class="p-4">電話</th>${state.crmType==='client'?'<th class="p-4">紙卷規格備註</th>':''}<th class="p-4">操作</th></tr>
                                    </thead>
                                    <tbody id="crmListBody" class="divide-y divide-slate-100">
                                        ${window.generateCRMRows()}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>`;
                else if(state.currentView === 'contact') mainContent = renderContact();

                app.innerHTML = `<div class="flex h-full w-full relative">${renderSidebar()}<div class="flex-1 flex flex-col h-full relative overflow-hidden bg-[#f8fafc]">${mainContent}</div></div>
                ${renderProductModal()}
                ${renderPaymentModal()}
                ${renderExpenseModal()}
                ${renderRegisterModal()}
                ${renderProfileModal()}
                ${renderImagePreviewModal()}
                ${state.showClientRepairDetail?renderClientRepairDetail():''}
                ${state.showAdminOrderModal?renderAdminOrderModal():''}
                ${state.showOrderEditModal?renderOrderEditModal():''}
                ${state.showHistoryModal?renderHistoryModal():''}
                ${state.showShipmentModal?renderShipmentModal():''}
                ${state.showOrderConfirmModal?renderOrderConfirmModal():''}`;
            }
            lucide.createIcons();
            
            if (focusedId) {
                const el = document.getElementById(focusedId);
                if (el && focusedId !== 'orderSearchInput' && focusedId !== 'crmSearchInput' && focusedId !== 'adminClientSearchInput') {
                    el.focus();
                    if (cursorPosition !== undefined && (el.type === 'text' || el.type === 'search')) {
                        el.setSelectionRange(cursorPosition, cursorPosition);
                    }
                }
            }
        }

        renderApp();
    </script>
</body>
</html>
